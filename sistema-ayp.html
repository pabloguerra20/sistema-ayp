<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema AyP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" onerror="window.__lucideFailed=true"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onerror="window.__chartFailed=true"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="window.__supaFailed=true"></script>
<style>
:root{
  --bg:#f8f8f8; --surface:#ffffff; --surface-2:#f3f3f5;
  --sidebar:#1a1a1a; --sidebar-hover:#262626; --sidebar-active:#6366f1;
  --text:#18181b; --text-soft:#52525b; --text-mut:#a1a1aa;
  --border:#e7e7ea; --accent:#6366f1; --accent-soft:#eef2ff;
  --green:#16a34a; --green-soft:#dcfce7;
  --amber:#d97706; --amber-soft:#fef3c7;
  --red:#dc2626; --red-soft:#fee2e2;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 10px 40px rgba(0,0,0,.12);
  --radius:12px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--sidebar);color:#e5e5e5;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;padding:20px 14px;z-index:40;}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.brand .logo i{width:19px;height:19px}
.brand h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.2px}
.brand span{font-size:11px;color:#8a8a8a;display:block;font-weight:500}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#6b6b6b;font-weight:600;padding:14px 10px 8px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:#b5b5b5;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:500;transition:.13s;margin-bottom:2px;}
.nav-item i{width:18px;height:18px;flex-shrink:0;pointer-events:none}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid #2c2c2c}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;margin-left:auto;flex-shrink:0;box-shadow:0 0 6px #22c55e80}
.sync-dot.offline{background:#f59e0b;box-shadow:0 0 6px #f59e0b80}
.sync-dot.error{background:#ef4444;box-shadow:0 0 6px #ef444480}

.main{flex:1;margin-left:248px;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 32px 18px;gap:16px;}
.topbar h2{font-size:22px;font-weight:700;letter-spacing:-.4px}
.topbar p{font-size:13px;color:var(--text-soft);margin-top:2px}
.content{padding:4px 32px 48px;flex:1}

/* Loading overlay */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:14px;}
.loading-screen .logo-big{width:52px;height:52px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;}
.loading-screen .logo-big i{width:28px;height:28px}
.loading-screen p{font-size:14px;color:var(--text-soft);font-weight:500}
.spinner{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen.hidden{display:none}

/* Error banner */
.error-banner{background:var(--red-soft);border:1px solid #fca5a5;border-radius:10px;padding:14px 18px;margin-bottom:18px;font-size:13px;color:#991b1b;display:none;align-items:center;gap:10px;}
.error-banner.show{display:flex}
.error-banner i{width:16px;height:16px;flex-shrink:0}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:var(--radius-sm);padding:9px 15px;font-size:13.5px;font-weight:600;transition:.13s;white-space:nowrap;}
.btn i{width:16px;height:16px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#5457e0}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#c11d1d}
.btn-icon{padding:7px;border-radius:7px;background:transparent;border:1px solid var(--border);color:var(--text-soft)}
.btn-icon:hover{background:var(--surface-2);color:var(--text)}
.btn-icon i{width:15px;height:15px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px 22px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:15px;font-weight:700}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12px;color:var(--text-soft);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .lbl i{width:14px;height:14px;color:var(--text-mut)}
.kpi .val{font-size:25px;font-weight:700;letter-spacing:-.6px;margin-top:8px}
.kpi .sub{font-size:12px;color:var(--text-mut);margin-top:3px;font-weight:500}
.kpi .val.green{color:var(--green)}
.kpi .val.red{color:var(--red)}
.kpi .val.amber{color:var(--amber)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-mut);font-weight:600;padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:.1s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--text-mut)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.gray{background:var(--surface-2);color:var(--text-soft)}
.badge.indigo{background:var(--accent-soft);color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-soft);margin-bottom:6px}
.input,select.input,textarea.input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);transition:.13s;}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:64px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:6px 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-soft);transition:.12s}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{border:none;background:none;padding:10px 4px;margin-right:18px;font-size:14px;font-weight:600;color:var(--text-mut);border-bottom:2px solid transparent;transition:.12s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}

.lineas-tbl input,.lineas-tbl select{padding:7px 9px}
.lineas-tbl td{padding:7px 8px}
.line-sub{font-weight:600;font-variant-numeric:tabular-nums}

.overlay{position:fixed;inset:0;background:rgba(15,15,18,.45);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:80;padding:20px;}
.overlay.show{display:flex;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);gap:12px}
.modal-head h3{font-size:16px;font-weight:700;flex:1}
.modal-body{padding:20px 22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border)}

.empty{text-align:center;padding:48px 20px;color:var(--text-mut)}
.empty i{width:36px;height:36px;margin-bottom:10px;opacity:.5}
.empty p{font-size:14px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);z-index:120;opacity:0;transition:.25s;display:flex;align-items:center;gap:9px;}
.toast i{width:16px;height:16px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.abonos-row{background:var(--surface-2)}
.abonos-row td{padding:0}
.abonos-inner{padding:10px 22px 14px 46px}
.abono-line{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--border);color:var(--text-soft)}
.abono-line:last-child{border-bottom:none}
.expand-btn{background:none;border:none;color:var(--text-mut);padding:2px;cursor:pointer;display:inline-flex}
.expand-btn i{width:15px;height:15px;transition:.15s}
.expand-btn.open i{transform:rotate(90deg)}
.chip-add{font-size:12px;color:var(--accent);font-weight:600;background:none;border:none;padding:0;cursor:pointer;margin-left:8px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.cat-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px}
.cat-vapes{background:#ede9fe;color:#7c3aed}
.cat-mieles{background:#fef3c7;color:#b45309}
.section-gap{margin-top:18px}
.hint{font-size:12px;color:var(--text-mut);margin-top:5px}
.rank-item{margin-bottom:14px}
.rank-item:last-child{margin-bottom:0}
.rank-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.rank-header .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.rank-header .val{color:var(--text-soft)}
.rank-bar-track{height:7px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.rank-bar-fill{height:100%;border-radius:5px;transition:width .4s ease}
.rank-bar-fill.indigo{background:var(--accent)}
.rank-bar-fill.green{background:var(--green)}
.rank-bar-fill.amber{background:var(--amber)}

@media(max-width:880px){
  .sidebar{width:64px;padding:18px 10px}
  .brand h1,.brand span,.nav-item span,.nav-label{display:none}
  .nav-item{justify-content:center}
  .main{margin-left:64px}
  .content,.topbar{padding-left:18px;padding-right:18px}
  #dashRent .tbl-wrap{font-size:12px}
}

/* ---------- Login / seleccion de perfil ---------- */
.login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#111114,#1c1c22 60%,#111114);display:flex;align-items:center;justify-content:center;z-index:210;padding:24px;}
.login-box{width:100%;max-width:380px;background:var(--surface);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.5);padding:34px 30px 30px;animation:pop .22s ease}
.login-head{text-align:center;margin-bottom:24px;position:relative}
.login-logo{width:52px;height:52px;border-radius:15px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 14px}
.login-logo i{width:27px;height:27px}
.login-head h1{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:2px}
.login-head p{font-size:13px;color:var(--text-soft)}
.login-back{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-soft)}
.login-back:hover{background:var(--surface-2)}
.login-back i{width:17px;height:17px}
.login-profiles{display:flex;flex-direction:column;gap:12px}
.login-profile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);transition:.14s}
.login-profile:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.lp-ic{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.lp-ic i{width:22px;height:22px}
.lp-ic.big{width:56px;height:56px;margin:0 auto 12px;background:var(--accent-soft)}
.lp-ic.big i{width:28px;height:28px}
.login-profile .lp-name{font-size:15px;font-weight:700;display:block}
.login-profile .lp-role{font-size:12px;color:var(--text-soft);display:block}
.login-profile > span:not(.lp-ic){display:flex;flex-direction:column}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:6px 0 4px}
.pin-dots.shake{animation:shake .38s}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--border);transition:.12s}
.pin-dot.on{background:var(--accent);border-color:var(--accent)}
.pin-err{text-align:center;color:var(--red);font-size:12.5px;font-weight:600;height:18px;margin-bottom:6px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:250px;margin:6px auto 0}
.pin-key{height:58px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:21px;font-weight:600;color:var(--text);transition:.1s;display:flex;align-items:center;justify-content:center}
.pin-key:hover{background:var(--surface-2)}
.pin-key:active{transform:scale(.95);background:var(--accent-soft)}
.pin-key.pin-del i{width:22px;height:22px}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ---------- Chip de usuario en sidebar ---------- */
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:#ffffff0d;margin-bottom:8px}
.uc-ic{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.uc-ic i{width:17px;height:17px}
.uc-info{display:flex;flex-direction:column;min-width:0;flex:1}
.uc-name{font-size:12.5px;font-weight:700;color:#fff;line-height:1.2}
.uc-role{font-size:10.5px;color:#8a8a8a;font-weight:500}
.uc-out{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:#8a8a8a;display:flex;align-items:center;justify-content:center;transition:.13s;flex-shrink:0}
.uc-out:hover{background:#ffffff14;color:#ef4444}
.uc-out i{width:16px;height:16px}

/* ---------- Reparto de utilidades ---------- */
.reparto-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.reparto-stat{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:11px 12px}
.reparto-stat .rs-lbl{font-size:10.5px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
.reparto-stat .rs-val{font-size:16px;font-weight:800;letter-spacing:-.3px}
.reparto-warn{background:var(--amber-soft);color:#92400e;border-radius:9px;padding:10px 12px;font-size:12px;font-weight:500;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.reparto-warn i{width:15px;height:15px;flex-shrink:0;margin-top:1px}
@media(max-width:520px){ .reparto-stats{grid-template-columns:1fr} }
.login-form{margin-top:4px}
.login-form .field{margin-bottom:14px;text-align:left}
</style>
</head>
<body>

<!-- Loading screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="logo-big"><i data-lucide="boxes"></i></div>
  <div class="spinner"></div>
  <p id="loadingMsg">Conectando con Supabase…</p>
</div>

<!-- Login / seleccion de perfil -->
<div class="login-screen" id="loginScreen" style="display:none">
  <div class="login-box" id="loginBox"></div>
</div>

<div class="app" id="appShell" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><i data-lucide="boxes"></i></div>
      <div><h1>Sistema AyP</h1><span>Compra · Venta · Crédito</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="userChip"></div>
      <div style="display:flex;align-items:center;gap:8px;padding:10px 10px 0;font-size:11px;color:#6b6b6b">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncLabel">Conectado</span>
      </div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content">
      <div class="error-banner" id="errBanner"><i data-lucide="alert-triangle"></i><span id="errMsg"></span></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   SISTEMA AyP v3 — Supabase backend + Realtime
   ============================================================ */

/* ---------- Red de seguridad: errores visibles (no spinner mudo) ---------- */
function __mostrarErrorArranque(msg){
  try{
    var ls=document.getElementById('loadingScreen');
    var m=document.getElementById('loadingMsg');
    var sp=document.querySelector('.loading-screen .spinner');
    if(ls){ ls.classList.remove('hidden'); ls.style.display='flex'; }
    if(sp) sp.style.display='none';
    if(m){
      m.style.maxWidth='340px'; m.style.textAlign='center';
      m.innerHTML='<strong>No se pudo iniciar la app</strong><br><span style="font-size:12.5px;color:#71717a">'+String(msg)+'</span>';
      if(!document.getElementById('__retryBtn')){
        var b=document.createElement('button'); b.id='__retryBtn'; b.textContent='Reintentar';
        b.style.cssText='margin-top:14px;padding:9px 18px;border-radius:8px;border:1px solid #d4d4d8;background:#fff;font-weight:600;cursor:pointer';
        b.onclick=function(){ location.reload(); };
        if(m.parentElement) m.parentElement.appendChild(b);
      }
    }
  }catch(_){}
}
window.addEventListener('error', function(ev){
  if(ev && ev.message && /Script error/i.test(ev.message)) return; // errores CORS de CDNs, ignora
  __mostrarErrorArranque((ev && ev.message) ? ev.message : 'Error inesperado');
});
window.addEventListener('unhandledrejection', function(ev){
  var r = ev && ev.reason; __mostrarErrorArranque((r && r.message) ? r.message : 'Fallo de conexión');
});

const SUPA_URL  = "https://xfmatolvijmnvtrtidwu.supabase.co";
const SUPA_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmbWF0b2x2aWptbnZ0cnRpZHd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMTIyODEsImV4cCI6MjA5NTU4ODI4MX0.ailruytswxcqPJVHUhYYETLhWdpbbp1ZEOfyZb9SY7U";

/* ---------- Supabase SDK ---------- */
if(typeof supabase === 'undefined' || window.__supaFailed){
  __mostrarErrorArranque('No se pudo cargar la librería de Supabase. Revisa tu conexión a internet o desactiva bloqueadores/VPN y reintenta.');
  throw new Error('Supabase SDK no disponible');
}
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

async function sbGet(table, opts){
  let q = supa.from(table).select('*');
  if(opts && opts.order) q = q.order(opts.order, {ascending: opts.asc !== false});
  const {data, error} = await q;
  if(error) throw new Error(error.message);
  return data;
}
async function sbInsert(table, body){
  const {data, error} = await supa.from(table).insert(Array.isArray(body)?body:[body]).select();
  if(error) throw new Error(error.message);
  return data;
}
async function sbUpdate(table, id, body){
  const {data, error} = await supa.from(table).update(body).eq('id', id).select();
  if(error) throw new Error(error.message);
  return data;
}
async function sbDelete(table, id){
  const {error} = await supa.from(table).delete().eq('id', id);
  if(error) throw new Error(error.message);
}

// true = ese rol PUEDE ver la informacion
const PERMISOS = {
  dueno:    { repartoUtil:true,  flujoNeto:true,  saldoAcum:true  },
  empleado: { repartoUtil:false, flujoNeto:false, saldoAcum:false },
};
function rolLabel(r){ return r==='dueno' ? 'Dueño' : 'Operación'; }
let SESION = null; // {id, email, nombre, rol, label}
function can(p){ return !!(SESION && PERMISOS[SESION.rol] && PERMISOS[SESION.rol][p]); }
function esDueno(){ return !!(SESION && SESION.rol==='dueno'); }
async function hashPass(pw){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function guardarSesion(u){
  SESION = { id:u.id, email:u.email, nombre:u.nombre, rol:u.rol, label:rolLabel(u.rol) };
  try{ localStorage.setItem('ayp_sesion_v2', JSON.stringify(SESION)); }catch(e){}
}
function cerrarSesion(){
  try{ localStorage.removeItem('ayp_sesion_v2'); }catch(e){}
  SESION=null; location.reload();
}
function sesionGuardada(){
  try{
    const s=JSON.parse(localStorage.getItem('ayp_sesion_v2')||'null');
    if(s && s.id && PERMISOS[s.rol]) return s;
  }catch(e){}
  return null;
}

/* ---------- Utilidades ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmt(n){ return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2}).format(n||0); }
function fmtInt(n){ return new Intl.NumberFormat('es-MX').format(n||0); }
function toISODate(dt){ return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function todayISO(){ return toISODate(new Date()); }
function daysAgoISO(d){ const t=new Date(); t.setDate(t.getDate()-d); return toISODate(t); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.slice(0,10).split('-'); return `${d}/${m}/${y}`; }
function icons(){
  if(!window.__lucideFailed && window.lucide) lucide.createIcons();
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setLoading(msg){ document.getElementById('loadingMsg').textContent = msg||'Cargando…'; }
function showErr(msg){ const b=document.getElementById('errBanner'); if(!b) return; const s=b.querySelector('#errMsg'); if(s) s.textContent=msg; b.classList.add('show'); }
function hideErr(){ const b=document.getElementById('errBanner'); if(b) b.classList.remove('show'); }
function setSyncStatus(s){ // 'ok'|'syncing'|'error'
  const dot=document.getElementById('syncDot'), lbl=document.getElementById('syncLabel');
  if(s==='ok'){ dot.className='sync-dot'; lbl.textContent='Conectado'; }
  else if(s==='syncing'){ dot.className='sync-dot offline'; lbl.textContent='Sincronizando…'; }
  else{ dot.className='sync-dot error'; lbl.textContent='Sin conexión'; }
}

/* ---------- Carga inicial (paralela) ---------- */
async function loadAll(){
  // Carga SECUENCIAL (una tabla a la vez) con progreso visible y límite por tabla.
  // Evita atorones por 9 conexiones simultáneas y muestra exactamente dónde falla.
  const pasos = [
    ['ayp_productos',    'productos',     {order:'nombre',      asc:true}],
    ['ayp_entidades',    'clientes',      {order:'nombre',      asc:true}],
    ['ayp_ventas',       'ventas',        {order:'fecha',       asc:false}],
    ['ayp_venta_lineas', 'detalle ventas',{order:'venta_id',    asc:true}],
    ['ayp_compras',      'compras',       {order:'fecha',       asc:false}],
    ['ayp_compra_lineas','detalle compras',{order:'compra_id',  asc:true}],
    ['ayp_cuentas',      'cuentas',       {order:'fecha_origen',asc:false}],
    ['ayp_abonos',       'abonos',        {order:'fecha',       asc:true}],
    ['ayp_gastos',       'gastos',        {order:'fecha',       asc:false}],
  ];
  const R={};
  for(let i=0;i<pasos.length;i++){
    const [tabla,etq,opts]=pasos[i];
    try{ setLoading('Cargando '+etq+'… ('+(i+1)+'/'+pasos.length+')'); }catch(_){}
    R[tabla]=await withTimeout(sbGet(tabla,opts), 12000, 'Tabla '+etq);
  }
  try{ setLoading('Preparando…'); }catch(_){}
  const productos=R['ayp_productos'], entidades=R['ayp_entidades'],
        ventas=R['ayp_ventas'], vlineas=R['ayp_venta_lineas'],
        compras=R['ayp_compras'], clineas=R['ayp_compra_lineas'],
        cuentas=R['ayp_cuentas'], abonos=R['ayp_abonos'], gastos=R['ayp_gastos'];

  DB.productos = productos.map(p=>({
    id:p.id, nombre:p.nombre, categoria:p.categoria,
    precioCostoRef:+p.precio_costo_ref, activo:p.activo
  }));
  DB.entidades = entidades.map(e=>({
    id:e.id, nombre:e.nombre, tipo:e.tipo, telefono:e.telefono, notas:e.notas
  }));
  DB.ventas = ventas.map(v=>({
    id:v.id, entidadId:v.entidad_id, fecha:v.fecha, condicion:v.condicion,
    anticipo:+v.anticipo, total:+v.total, cancelado:v.cancelado,
    lineas: vlineas.filter(l=>l.venta_id===v.id).map(l=>({
      id:l.id, productoId:l.producto_id, cantidad:+l.cantidad, precioUnit:+l.precio_unit, subtotal:+l.subtotal
    }))
  }));
  DB.compras = compras.map(c=>({
    id:c.id, entidadId:c.entidad_id, fecha:c.fecha, condicion:c.condicion,
    anticipo:+c.anticipo, envio:+c.envio, seguro:+c.seguro, total:+c.total, cancelado:c.cancelado,
    lineas: clineas.filter(l=>l.compra_id===c.id).map(l=>({
      id:l.id, productoId:l.producto_id, cantidad:+l.cantidad, precioUnit:+l.precio_unit, subtotal:+l.subtotal
    }))
  }));
  DB.cuentas = cuentas.map(ct=>({
    id:ct.id, tipo:ct.tipo, refId:ct.ref_id, entidadId:ct.entidad_id,
    fechaOrigen:ct.fecha_origen, montoTotal:+ct.monto_total,
    abonos: abonos.filter(a=>a.cuenta_id===ct.id).map(a=>({
      id:a.id, cuentaId:a.cuenta_id, monto:+a.monto, fecha:a.fecha, nota:a.nota
    }))
  }));
  DB.gastos = gastos.map(g=>({
    id:g.id, fecha:g.fecha, categoria:g.categoria, descripcion:g.descripcion, monto:+g.monto
  }));
}

/* ---------- Retiros de utilidades (carga tolerante a fallo) ----------
   Se carga por separado: si la tabla ayp_retiros aun no existe,
   la app sigue funcionando y el modulo Reparto se muestra vacio.     */
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error((label||'Operación')+': tiempo de espera agotado ('+(ms/1000)+'s)')), ms))
  ]);
}
async function loadRetiros(){
  DB.retiros = [];
  window.__retirosTablaFalta = false;
  try{
    const rows = await sbGet('ayp_retiros', {order:'fecha', asc:false});
    DB.retiros = rows.map(r=>({ id:r.id, fecha:r.fecha, monto:+r.monto, nota:r.nota, socio:r.socio||'Pablo' }));
  }catch(e){
    window.__retirosTablaFalta = true;
  }
}

/* ---------- Realtime (SDK oficial) — canal único con debounce ---------- */
function initRealtime(){
  const tablas = ['ayp_productos','ayp_entidades','ayp_ventas','ayp_venta_lineas',
                  'ayp_compras','ayp_compra_lineas','ayp_cuentas','ayp_abonos','ayp_gastos'];
  let reloadTimer = null;
  let rendering = false;
  function scheduleReload(){
    // Debounce 400ms — un solo reload aunque lleguen N eventos juntos
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(async ()=>{
      if(rendering) return;
      rendering = true;
      setSyncStatus('syncing');
      try{
        await loadAll();
        render();
        // icons() ya se llama dentro de render(); no duplicar aquí
        setSyncStatus('ok');
      }catch(e){ setSyncStatus('error'); }
      finally{ rendering = false; }
    }, 400);
  }
  // Un solo canal que escucha todas las tablas ayp_*
  const ch = supa.channel('ayp-all-changes');
  tablas.forEach(tabla=>{
    ch.on('postgres_changes', {event:'*', schema:'public', table:tabla}, scheduleReload);
  });
  ch.subscribe(status=>{
    if(status==='SUBSCRIBED') setSyncStatus('ok');
    if(status==='CHANNEL_ERROR') setSyncStatus('error');
  });
}

/* ---------- Cálculos derivados ---------- */
function ventasActivas(){ return DB.ventas.filter(v=>!v.cancelado); }
function comprasActivas(){ return DB.compras.filter(c=>!c.cancelado); }
function getStock(pid){
  let s=0;
  comprasActivas().forEach(c=>c.lineas.forEach(l=>{ if(l.productoId===pid) s+=l.cantidad; }));
  ventasActivas().forEach(v=>v.lineas.forEach(l=>{ if(l.productoId===pid) s-=l.cantidad; }));
  return s;
}
function prod(id){ return DB.productos.find(p=>p.id===id); }
function ent(id){ return DB.entidades.find(e=>e.id===id); }
function entName(id){ const e=ent(id); return e?e.nombre:'—'; }
function prodName(id){ const p=prod(id); return p?p.nombre:'—'; }
function compraFlete(c){ return (c.envio||0)+(c.seguro||0); }
function compraPiezas(c){ return c.lineas.reduce((a,l)=>a+(l.cantidad||0),0); }
function compraFleteUnit(c){ const pz=compraPiezas(c); return pz>0?compraFlete(c)/pz:0; }
function compraMercancia(c){ return c.lineas.reduce((a,l)=>a+l.subtotal,0); }
function compraTotal(c){ return compraMercancia(c)+compraFlete(c); }
function costoUnitReal(pid){
  let q=0,val=0;
  comprasActivas().forEach(c=>{
    const fu=compraFleteUnit(c);
    c.lineas.forEach(l=>{ if(l.productoId===pid){ q+=l.cantidad; val+=l.cantidad*((l.precioUnit||0)+fu); } });
  });
  if(q>0) return val/q;
  const p=prod(pid); return p?p.precioCostoRef:0;
}
function valorInventario(){ return DB.productos.reduce((a,p)=>a+Math.max(0,getStock(p.id))*costoUnitReal(p.id),0); }
function costoVentaReal(v){ return v.lineas.reduce((a,l)=>a+l.cantidad*costoUnitReal(l.productoId),0); }
function cuentaPagado(c){ return c.abonos.reduce((a,b)=>a+b.monto,0); }
function cuentaSaldo(c){ return Math.max(0,c.montoTotal-cuentaPagado(c)); }
function cuentaEstado(c){ const p=cuentaPagado(c); if(p>=c.montoTotal-0.001) return 'pagado'; if(p>0) return 'parcial'; return 'pendiente'; }
function cuentaCancelada(ct){
  // True si la venta/compra de origen está cancelada → no debe contar como saldo vivo
  if(ct.tipo==='cxc'){ const v=DB.ventas.find(v=>v.id===ct.refId); return !!(v&&v.cancelado); }
  const c=DB.compras.find(c=>c.id===ct.refId); return !!(c&&c.cancelado);
}
function getMovimientos(){
  const movs=[];
  ventasActivas().forEach(v=>{
    if(v.condicion==='contado') movs.push({fecha:v.fecha,tipo:'venta',desc:`Venta contado · ${entName(v.entidadId)}`,monto:v.total,signo:1,key:'v-'+v.id});
  });
  comprasActivas().forEach(c=>{
    if(c.condicion==='contado') movs.push({fecha:c.fecha,tipo:'compra',desc:`Compra contado · ${entName(c.entidadId)}${compraFlete(c)>0?' (incl. flete)':''}`,monto:compraTotal(c),signo:-1,key:'c-'+c.id});
  });
  DB.cuentas.forEach(ct=>{
    const refCanc = ct.tipo==='cxc' ? DB.ventas.find(v=>v.id===ct.refId)?.cancelado : DB.compras.find(c=>c.id===ct.refId)?.cancelado;
    if(refCanc) return;
    ct.abonos.forEach(ab=>{
      const signo = ct.tipo==='cxc'?1:-1;
      const tipo  = ct.tipo==='cxc'?'abono cobrado':'abono pagado';
      movs.push({fecha:ab.fecha,tipo,desc:`${tipo.charAt(0).toUpperCase()+tipo.slice(1)} · ${entName(ct.entidadId)}${ab.nota?' ('+ab.nota+')':''}`,monto:ab.monto,signo,key:'ab-'+ab.id});
    });
  });
  movs.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
  let acc=0; movs.forEach(m=>{ acc+=m.signo*m.monto; m.saldoAcc=acc; });
  return movs;
}
function inPeriod(iso,p){
  if(p==='todo') return true;
  const d=new Date(iso+'T00:00:00'), now=new Date(); now.setHours(0,0,0,0);
  if(p==='hoy') return iso===todayISO();
  if(p==='semana'){ const s=new Date(now); s.setDate(s.getDate()-6); return d>=s; }
  if(p==='mes') return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
  return true;
}

  document.getElementById('nav').innerHTML=NAV_GROUPS.filter(g=>!(g.soloDueno&&!esDueno())).map(g=>{

    return `<div class="nav-label">${g.cat}</div>`+items.map(v=>
      `<button class="nav-item ${current===v.id?'active':''}" data-view="${v.id}"><i data-lucide="${v.icon}"></i><span>${v.label}</span></button>`
    ).join('');
  }).join('');

function navigate(view){
  if(view==='cobranza') pagosTab='cxc';
  if(view==='pagos')    pagosTab='cxp';
  current=view; renderNav(); render(); document.querySelector('.content').scrollTop=0;
}
function setTop(title,sub,actions){
  document.getElementById('topbar').innerHTML=`<div><h2>${title}</h2><p>${sub||''}</p></div><div style="display:flex;gap:10px">${actions||''}</div>`;
  icons();
}
function render(){
  const c=document.getElementById('content');
  // Salvar el banner ANTES de que cualquier render limpie el DOM
  const banner=document.getElementById('errBanner');
  if(banner) banner.remove(); // sacarlo del DOM temporalmente
  hideErr();
  if(current==='dashboard') renderDashboard(c);
  else if(current==='productos') renderProductos(c);
  else if(current==='historial') renderHistorial(c);
  else if(current==='venta') renderTransForm(c,'venta');
  else if(current==='compra') renderTransForm(c,'compra');
  else if(current==='pagos'||current==='cobranza') renderPagos(c);
  else if(current==='movimientos') renderMovimientos(c);
  else if(current==='entidades') renderEntidades(c);
  else if(current==='perfil-entidad') renderPerfilEntidad(c);
  else if(current==='perfil-producto') renderPerfilProducto(c);
  else if(current==='gastos') renderGastos(c);
  else if(current==='finanzas') renderFinanzas(c);
  else if(current==='usuarios') renderUsuarios(c);
  // Reinyectar el banner al inicio del contenido
  if(banner) c.prepend(banner);
  icons();
}

   DASHBOARD

let dashPeriod='mes', dashChart=null;
function renderRankList(items,colorClass,valueFn){
  if(!items.length) return '<div class="empty" style="padding:24px 20px"><p>Sin datos en el período</p></div>';
  const max=valueFn(items[0]);
  return items.map((it,i)=>{
    const v=valueFn(it), pct=max>0?(v/max*100):0;
    return `<div class="rank-item"><div class="rank-header"><span class="name">${i+1}. ${esc(it.nombre)}</span><span class="val">${it.sub||''} ${fmt(v)}</span></div><div class="rank-bar-track"><div class="rank-bar-fill ${colorClass}" style="width:${pct}%"></div></div></div>`;
  }).join('');
}
function renderDashboard(c){
  setTop('Dashboard','Resumen del negocio',
    `<div class="seg" id="periodSeg">${[['hoy','Hoy'],['semana','Semana'],['mes','Mes'],['todo','Todo']].map(p=>`<button data-p="${p[0]}" class="${dashPeriod===p[0]?'active':''}">${p[1]}</button>`).join('')}</div>`);
  const ventasP=ventasActivas().filter(v=>inPeriod(v.fecha,dashPeriod));
  const comprasP=comprasActivas().filter(c=>inPeriod(c.fecha,dashPeriod));
  const totalFacturado=ventasP.reduce((a,v)=>a+v.total,0);
  const cobradoContado=ventasP.filter(v=>v.condicion==='contado').reduce((a,v)=>a+v.total,0);
  const cobradoAbonos=DB.cuentas.filter(ct=>ct.tipo==='cxc').reduce((a,ct)=>{
    const refV=DB.ventas.find(v=>v.id===ct.refId); if(refV&&refV.cancelado) return a;
    return a+ct.abonos.filter(ab=>inPeriod(ab.fecha,dashPeriod)).reduce((s,ab)=>s+ab.monto,0);
  },0);
  const totalCobrado=cobradoContado+cobradoAbonos;
  let costoVentas=0; ventasP.forEach(v=>{ costoVentas+=costoVentaReal(v); });
  const utilidad=totalFacturado-costoVentas;
  const margen=totalFacturado>0?(utilidad/totalFacturado*100):0;
  const egresadoContado=comprasP.filter(c=>c.condicion==='contado').reduce((a,c)=>a+compraTotal(c),0);
  const egresadoAbonos=DB.cuentas.filter(ct=>ct.tipo==='cxp').reduce((a,ct)=>{
    const refC=DB.compras.find(c=>c.id===ct.refId); if(refC&&refC.cancelado) return a;
    return a+ct.abonos.filter(ab=>inPeriod(ab.fecha,dashPeriod)).reduce((s,ab)=>s+ab.monto,0);
  },0);
  const totalEgresado=egresadoContado+egresadoAbonos;
  const flujoNeto=totalCobrado-totalEgresado;

      <div class="kpi"><div class="lbl"><i data-lucide="arrow-down-circle"></i>Salidas</div><div class="val red">${fmt(totalEgresado)}</div><div class="sub">Contado + abonos pagados</div></div>

      <div class="kpi"><div class="lbl"><i data-lucide="boxes"></i>Valor de inventario</div><div class="val">${fmt(valInv)}</div><div class="sub">${fmtInt(piezasStock)} pz · landed cost prom.</div></div>
      <div class="kpi"><div class="lbl"><i data-lucide="hand-coins"></i>CxC pendiente</div><div class="val amber">${fmt(cxc)}</div><div class="sub">Por cobrar (total acumulado)</div></div>
      <div class="kpi"><div class="lbl"><i data-lucide="receipt"></i>CxP pendiente</div><div class="val red">${fmt(cxp)}</div><div class="sub">Por pagar (total acumulado)</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-bottom:18px" id="dashCols">
      <div class="card"><div class="card-head"><h3>Ventas vs. Compras</h3><span class="badge gray">${dashPeriod}</span></div><div class="card-pad"><div style="height:260px"><canvas id="chart"></canvas></div></div></div>
      <div class="card"><div class="card-head"><h3>Productos más vendidos</h3><span class="badge indigo">por monto</span></div><div class="card-pad">${renderRankList(topProds,'indigo',it=>it.monto)}</div></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px" id="dashCols2">

      <div class="card"><div class="card-head"><h3>Top Proveedores</h3><span class="badge amber">compras período</span></div><div class="card-pad">${renderRankList(topProvs,'amber',it=>it.monto)}</div></div>
    </div>
    <div class="card" id="dashRent">
      <div class="card-head"><h3>Rentabilidad por producto</h3><span class="badge gray">${dashPeriod} · ventas activas</span></div>

        <thead><tr>
          <th>Producto</th><th>Cat.</th>
          <th class="num">Piezas vend.</th>
          <th class="num">Ingresos</th>
          <th class="num">Costo real</th>
          <th class="num">Utilidad</th>
          <th class="num">Margen %</th>
          <th class="num">Stock actual</th>
        </tr></thead>
        <tbody>${(()=>{
          // Build per-product stats from ventasP
          const byProd={};
          ventasP.forEach(v=>v.lineas.forEach(l=>{
            if(!byProd[l.productoId]) byProd[l.productoId]={pz:0,ing:0,costo:0};
            byProd[l.productoId].pz+=l.cantidad;
            byProd[l.productoId].ing+=l.subtotal;
            byProd[l.productoId].costo+=l.cantidad*costoUnitReal(l.productoId);
          }));
          const rows=Object.entries(byProd).map(([pid,d])=>{
            const p=prod(pid); if(!p) return null;
            const util=d.ing-d.costo;
            const mg=d.ing>0?(util/d.ing*100):0;
            const stk=getStock(pid);
            const mgColor=mg>=30?'var(--green)':mg>=10?'var(--amber)':'var(--red)';
            return {pid,nombre:p.nombre,cat:p.categoria,pz:d.pz,ing:d.ing,costo:d.costo,util,mg,stk,mgColor};

          if(!rows.length) return `<tr><td colspan="8"><div class="empty" style="padding:32px 20px"><i data-lucide="bar-chart-2"></i><p>Sin ventas en el período</p></div></td></tr>`;

            <td class="num"><span style="font-weight:700;color:${r.mgColor}">${r.mg.toFixed(1)}%</span></td>
            <td class="num" style="${r.stk<=0?'color:var(--red);font-weight:600':'color:var(--text-soft)'}">${fmtInt(r.stk)} pz</td>
          </tr>`).join('');
        })()}</tbody>
      </table></div>
    </div>`;

  document.querySelectorAll('#periodSeg button').forEach(b=>b.onclick=()=>{ dashPeriod=b.dataset.p; renderDashboard(c); icons(); });
  drawChart(ventasP, comprasP);
  if(window.innerWidth<880){

function drawChart(ventasP, comprasP){
  if(window.__chartFailed||!window.Chart){ const cv=document.getElementById('chart'); if(cv) cv.parentElement.innerHTML='<div class="empty"><p>Gráfica no disponible</p></div>'; return; }
  const byMonth=dashPeriod==='todo';
  const buckets={};
  ventasP.forEach(v=>{
    const k=byMonth?v.fecha.slice(0,7):v.fecha;
    if(!buckets[k]) buckets[k]={vend:0,cost:0,util:0,comp:0};
    buckets[k].vend+=v.total;
    const cv=costoVentaReal(v); buckets[k].cost+=cv; buckets[k].util+=(v.total-cv);
  });
  comprasP.forEach(c=>{
    const k=byMonth?c.fecha.slice(0,7):c.fecha;
    if(!buckets[k]) buckets[k]={vend:0,cost:0,util:0,comp:0};
    buckets[k].comp+=compraTotal(c);
  });
  const keys=Object.keys(buckets).sort();
  const ctx=document.getElementById('chart'); if(!ctx) return;
  if(dashChart){ dashChart.destroy(); dashChart=null; }
  if(!keys.length){ ctx.parentElement.innerHTML='<div class="empty"><p>Sin datos para graficar</p></div>'; return; }
  const labels=keys.map(k=>byMonth?k:k.slice(8)+'/'+k.slice(5,7));
  dashChart=new Chart(ctx,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Ventas',data:keys.map(k=>buckets[k].vend),backgroundColor:'#6366f1',borderRadius:5,maxBarThickness:30,order:2},
        {label:'Compras',data:keys.map(k=>buckets[k].comp),backgroundColor:'#f59e0b',borderRadius:5,maxBarThickness:30,order:3},
        {label:'Utilidad',data:keys.map(k=>buckets[k].util),type:'line',borderColor:'#16a34a',backgroundColor:'#16a34a22',borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#16a34a',tension:0.3,fill:false,order:1},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:8,font:{family:'Inter',size:12}}},
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}}
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{family:'Inter',size:11}}},
        y:{beginAtZero:true,ticks:{font:{family:'Inter',size:11},callback:v=>v>=1000?'$'+(v/1000).toFixed(0)+'k':'$'+v},grid:{color:'#f0f0f0'}}
      }
    }
  });
}

function cancelarTrans(id,tipo){
  const r=tipo==='ventas'?DB.ventas.find(v=>v.id===id):DB.compras.find(c=>c.id===id);
  if(!r||r.cancelado) return;
  const isV=tipo==='ventas';
  // Cancelar una compra retira sus piezas del stock: bloquear si ya se vendieron (dejaría inventario negativo)
  if(!isV){
    const resta={};
    r.lineas.forEach(l=>resta[l.productoId]=(resta[l.productoId]||0)+l.cantidad);
    for(const pid in resta){
      if(getStock(pid)-resta[pid] < 0){
        toast(`No se puede cancelar: dejaría stock negativo de ${prodName(pid)} (ya se vendió)`,'alert-triangle');
        return;
      }
    }
  }
  const cuenta=DB.cuentas.find(ct=>ct.refId===id);
  openModal('Cancelar '+(isV?'venta':'compra'),`
    <div style="background:var(--red-soft);border:1px solid #fca5a5;border-radius:8px;padding:11px 13px;margin-bottom:14px;font-size:12.5px;color:#991b1b">
      <strong>Atención:</strong> revertirá el impacto en inventario y movimientos.

    </div>
    <p>¿Cancelar la ${isV?'venta':'compra'} de <strong>${esc(entName(r.entidadId))}</strong> del ${fmtDate(r.fecha)}?</p>
  `,async()=>{

      await sbUpdate(isV?'ayp_ventas':'ayp_compras',id,{cancelado:true});

      toast((isV?'Venta':'Compra')+' cancelada','x-circle'); icons();

  },'Cancelar operación');
  setTimeout(()=>{ const ok=document.getElementById('mOk'); if(ok){ ok.classList.remove('btn-primary'); ok.classList.add('btn-danger'); } },10);
}
function restaurarTrans(id,tipo){
  const r=tipo==='ventas'?DB.ventas.find(v=>v.id===id):DB.compras.find(c=>c.id===id);
  if(!r||!r.cancelado) return;

    <div class="tbl-wrap"><table class="lineas-tbl">
      <thead><tr><th style="width:40%">Producto</th><th class="num" style="width:13%">Cantidad</th><th class="num" style="width:17%">P. unitario</th><th class="num" style="width:20%">Subtotal</th><th></th></tr></thead>
      <tbody id="lineasBody"></tbody>
    </table></div>
    <button class="btn btn-ghost btn-sm" id="addLine" style="margin-top:12px"><i data-lucide="plus"></i>Agregar línea</button>
    ${!isV?`<div class="field-row section-gap">
      <div class="field"><label>Costo de envío</label><input class="input" type="number" min="0" step="0.01" id="f_envio" value="${formEnvio||''}" placeholder="0.00"></div>
      <div class="field"><label>Costo de seguro</label><input class="input" type="number" min="0" step="0.01" id="f_seguro" value="${formSeguro||''}" placeholder="0.00"></div>
    </div>`:''}
    ${isV?`<div style="display:flex;justify-content:flex-end;align-items:center;gap:18px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)">
      <span style="font-size:14px;color:var(--text-soft);font-weight:500">Total</span>
      <span style="font-size:24px;font-weight:700" id="f_total">$0.00</span></div>`
    :`<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end"><div style="min-width:280px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--text-soft)"><span>Mercancía</span><span id="f_merc">$0.00</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--text-soft)"><span>Envío</span><span id="f_env">$0.00</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--text-soft)"><span>Seguro</span><span id="f_seg">$0.00</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0 2px;margin-top:5px;border-top:1px solid var(--border)">
        <span style="font-size:14px;font-weight:600">Total</span><span style="font-size:23px;font-weight:700" id="f_total">$0.00</span></div>
      <p class="hint" id="f_fleteHint" style="text-align:right"></p>
    </div></div>`}
    <div class="field-row section-gap">
      <div class="field"><label>Condición de pago</label>
        <select class="input" id="f_cond" ${isE?'disabled':''}>
          <option value="contado">Contado</option><option value="credito">Crédito</option>
        </select>${isE?'<p class="hint">No modificable en edición.</p>':''}</div>
      <div class="field" id="anticipoWrap" style="display:none">
        <label>Anticipo (opcional)</label><input class="input" type="number" min="0" step="0.01" id="f_anticipo" placeholder="0.00">
        <p class="hint">Se registra como abono parcial inmediato.</p></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px">
      ${isE?`<button class="btn btn-ghost" id="f_cancelEdit"><i data-lucide="x"></i>Cancelar edición</button>`:''}
      <button class="btn btn-ghost" id="f_reset"><i data-lucide="rotate-ccw"></i>Limpiar</button>
      <button class="btn btn-primary" id="f_submit"><i data-lucide="check"></i>${isE?'Guardar cambios':(isV?'Registrar venta':'Registrar compra')}</button>
    </div>
  </div></div>`;

  const merc=()=>formLineas.reduce((a,l)=>a+(l.cantidad||0)*(l.precioUnit||0),0);
  const pzs=()=>formLineas.reduce((a,l)=>a+(l.cantidad||0),0);
  const flete=()=>isV?0:((formEnvio||0)+(formSeguro||0));
  const fu=()=>{ const p=pzs(); return p>0?flete()/p:0; };
  const total=()=>merc()+flete();
  function renderLineas(){
    const prods=DB.productos.filter(p=>p.activo);
    document.getElementById('lineasBody').innerHTML=formLineas.map((ln,i)=>{
      const sub=(ln.cantidad||0)*(ln.precioUnit||0);
      return `<tr>
        <td><select class="input lp" data-i="${i}"><option value="">Producto…</option>

        <td class="num"><input class="input lc" data-i="${i}" type="number" min="0" step="1" value="${ln.cantidad}"></td>
        <td class="num"><input class="input lpu" data-i="${i}" type="number" min="0" step="0.01" value="${ln.precioUnit}"></td>
        <td class="num"><span class="line-sub">${fmt(sub)}</span>${!isV?`<span class="muted line-real" style="font-size:11px;display:block;margin-top:2px"></span>`:''}
        </td>
        <td><button class="btn-icon" data-del="${i}"><i data-lucide="trash-2"></i></button></td>
      </tr>`;
    }).join('');
    const body=document.getElementById('lineasBody');
    body.querySelectorAll('.lp').forEach(s=>s.onchange=e=>{ formLineas[+e.target.dataset.i].productoId=e.target.value; renderLineas(); });
    body.querySelectorAll('.lc').forEach(inp=>inp.oninput=e=>{ formLineas[+e.target.dataset.i].cantidad=parseFloat(e.target.value)||0; refreshCalc(); });
    body.querySelectorAll('.lpu').forEach(inp=>inp.oninput=e=>{ formLineas[+e.target.dataset.i].precioUnit=parseFloat(e.target.value)||0; refreshCalc(); });
    body.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{ const i=+e.currentTarget.dataset.del; formLineas.splice(i,1); if(!formLineas.length) formLineas.push({productoId:'',cantidad:1,precioUnit:0}); renderLineas(); });
    icons(); refreshCalc();
  }
  function refreshCalc(){
    const f=fu(), rows=document.getElementById('lineasBody').querySelectorAll('tr');
    formLineas.forEach((ln,i)=>{
      const row=rows[i]; if(!row) return;
      const sub=(ln.cantidad||0)*(ln.precioUnit||0);
      const subEl=row.querySelector('.line-sub'); if(subEl) subEl.textContent=fmt(sub);
      if(!isV){ const r=row.querySelector('.line-real'); if(r) r.textContent=f>0?`Costo real: ${fmt((ln.precioUnit||0)+f)}/pza`:''; }
    });
    document.getElementById('f_total').textContent=fmt(total());
    if(!isV){
      document.getElementById('f_merc').textContent=fmt(merc());
      document.getElementById('f_env').textContent=fmt(formEnvio||0);
      document.getElementById('f_seg').textContent=fmt(formSeguro||0);
      const hint=document.getElementById('f_fleteHint');
      hint.textContent=flete()>0?`Flete prorrateado: ${fmt(f)}/pza entre ${fmtInt(pzs())} pz`:'';

  };
  if(isE) document.getElementById('f_cancelEdit').onclick=()=>{ resetForm(); navigate('historial'); };
  document.getElementById('f_submit').onclick=()=>submitTrans(kind);
}

async function submitTrans(kind){
  const isV=kind==='venta', isE=!!formEditingId;
  const entidadId=document.getElementById('f_ent').value;
  const fecha=document.getElementById('f_fecha').value||todayISO();
  const cond=document.getElementById('f_cond').value;
  const anticipo=cond==='credito'?(parseFloat(document.getElementById('f_anticipo').value)||0):0;
  if(!entidadId){ toast('Selecciona '+(isV?'cliente':'proveedor'),'alert-circle'); return; }
  const lineas=formLineas.filter(l=>l.productoId&&l.cantidad>0).map(l=>({
    productoId:l.productoId, cantidad:l.cantidad, precioUnit:l.precioUnit, subtotal:l.cantidad*l.precioUnit
  }));
  if(!lineas.length){ toast('Agrega al menos una línea válida','alert-circle'); return; }
  const mercancia=lineas.reduce((a,l)=>a+l.subtotal,0);
  const envio=isV?0:(formEnvio||0), seguro=isV?0:(formSeguro||0);
  const totalFinal=mercancia+envio+seguro;

  setSyncStatus('syncing');
  try{
    if(isE){
      const old=isV?DB.ventas.find(v=>v.id===formEditingId):DB.compras.find(c=>c.id===formEditingId);
      if(isV){
        const need={};
        lineas.forEach(l=>need[l.productoId]=(need[l.productoId]||0)+l.cantidad);
        for(const pid in need){
          const stockSinEsta=getStock(pid)+(old.lineas.find(l=>l.productoId===pid)?.cantidad||0);
          if(need[pid]>stockSinEsta){ toast(`Stock insuficiente de ${prodName(pid)}`,'alert-triangle'); setSyncStatus('ok'); return; }
        }
      }
      // Update header
      await sbUpdate(isV?'ayp_ventas':'ayp_compras', formEditingId, {
        entidad_id:entidadId, fecha, total:mercancia,
        ...(isV?{}:{envio,seguro})
      });
      // Delete old lines and re-insert
      const lineTable=isV?'ayp_venta_lineas':'ayp_compra_lineas';
      const lineFK=isV?'venta_id':'compra_id';
      const {error:delErr} = await supa.from(lineTable).delete().eq(lineFK, formEditingId);
      if(delErr) throw new Error(delErr.message);
      await sbInsert(lineTable, lineas.map(l=>({id:uid(),[lineFK]:formEditingId,producto_id:l.productoId,cantidad:l.cantidad,precio_unit:l.precioUnit,subtotal:l.subtotal})));
      // Update cuenta
      const cta=DB.cuentas.find(ct=>ct.refId===formEditingId);
      if(cta) await sbUpdate('ayp_cuentas',cta.id,{monto_total:totalFinal,entidad_id:entidadId});
      await loadAll(); resetForm(); toast((isV?'Venta':'Compra')+' actualizada','check-circle'); navigate('dashboard');
    } else {
      if(isV){
        const need={};
        lineas.forEach(l=>need[l.productoId]=(need[l.productoId]||0)+l.cantidad);
        for(const pid in need){
          if(need[pid]>getStock(pid)){ toast(`Stock insuficiente de ${prodName(pid)} (disp. ${fmtInt(getStock(pid))})`,'alert-triangle'); setSyncStatus('ok'); return; }
        }
      }
      if(anticipo>totalFinal){ toast('El anticipo no puede superar el total','alert-circle'); setSyncStatus('ok'); return; }
      const recId=uid();
      if(isV){
        await sbInsert('ayp_ventas',[{id:recId,entidad_id:entidadId,fecha,condicion:cond,anticipo,total:mercancia,cancelado:false}]);
        await sbInsert('ayp_venta_lineas',lineas.map(l=>({id:uid(),venta_id:recId,producto_id:l.productoId,cantidad:l.cantidad,precio_unit:l.precioUnit,subtotal:l.subtotal})));
      } else {
        await sbInsert('ayp_compras',[{id:recId,entidad_id:entidadId,fecha,condicion:cond,anticipo,envio,seguro,total:mercancia,cancelado:false}]);
        await sbInsert('ayp_compra_lineas',lineas.map(l=>({id:uid(),compra_id:recId,producto_id:l.productoId,cantidad:l.cantidad,precio_unit:l.precioUnit,subtotal:l.subtotal})));
      }
      if(cond==='credito'){
        const ctaId=uid();
        await sbInsert('ayp_cuentas',[{id:ctaId,tipo:isV?'cxc':'cxp',ref_id:recId,entidad_id:entidadId,fecha_origen:fecha,monto_total:totalFinal}]);
        if(anticipo>0) await sbInsert('ayp_abonos',[{id:uid(),cuenta_id:ctaId,monto:anticipo,fecha,nota:'Anticipo'}]);
      }
      await loadAll(); resetForm();
      toast((isV?'Venta':'Compra')+' registrada · '+fmt(totalFinal),'check-circle');
      navigate('dashboard');
    }
  }catch(e){ showErr('Error al guardar: '+e.message); }
  setSyncStatus('ok');
}

let pagosTab='cxc', pagosFilter='todos', expandedCuenta=null;

  cuentas.sort((a,b)=>a.fechaOrigen<b.fechaOrigen?1:-1);

  c.innerHTML=`
    <div class="tabs">
      <button class="tab ${tipo==='cxc'?'active':''}" data-tab="cxc">Cuentas por Cobrar</button>
      <button class="tab ${tipo==='cxp'?'active':''}" data-tab="cxp">Cuentas por Pagar</button>
    </div>
    <div class="filters">
      <div class="seg" id="pf">${[['todos','Todos'],['pendiente','Pendientes'],['parcial','Parciales'],['pagado','Pagados']].map(f=>`<button data-f="${f[0]}" class="${pagosFilter===f[0]?'active':''}">${f[1]}</button>`).join('')}</div>
      <div style="margin-left:auto;font-size:13px;color:var(--text-soft)">Saldo ${tipo==='cxc'?'por cobrar':'por pagar'}: <strong style="color:${tipo==='cxc'?'var(--amber)':'var(--red)'}">${fmt(totalPend)}</strong></div>
    </div>
    <div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th></th><th>${tipo==='cxc'?'Cliente':'Proveedor'}</th><th>Origen</th><th class="num">Total</th><th class="num">Pagado</th><th class="num">Saldo</th><th>Estado</th><th></th></tr></thead>
      <tbody>${cuentas.length?cuentas.map(ct=>{
        const pag=cuentaPagado(ct),sal=cuentaSaldo(ct),est=cuentaEstado(ct);
        const badge=est==='pagado'?'<span class="badge green"><span class="dot"></span>Pagado</span>':est==='parcial'?'<span class="badge amber"><span class="dot"></span>Parcial</span>':'<span class="badge red"><span class="dot"></span>Pendiente</span>';
        const open=expandedCuenta===ct.id;
        const refCanc=ct.tipo==='cxc'?DB.ventas.find(v=>v.id===ct.refId)?.cancelado:DB.compras.find(c=>c.id===ct.refId)?.cancelado;
        const rowMain=`<tr style="${refCanc?'opacity:.5':''}">
          <td><button class="expand-btn ${open?'open':''}" onclick="toggleExpand('${ct.id}')"><i data-lucide="chevron-right"></i></button></td>
          <td style="font-weight:600">${esc(entName(ct.entidadId))}${refCanc?' <span class="badge gray" style="font-size:10px">cancelada</span>':''}</td>
          <td class="muted">${fmtDate(ct.fechaOrigen)}</td>
          <td class="num">${fmt(ct.montoTotal)}</td>
          <td class="num">${fmt(pag)}</td>
          <td class="num" style="font-weight:600">${fmt(sal)}</td>
          <td>${badge}</td>
          <td><div class="row-actions">${est!=='pagado'&&!refCanc?`<button class="btn btn-ghost btn-sm" onclick="openAbono('${ct.id}')"><i data-lucide="plus"></i>Abonar</button>`:'<span class="muted" style="font-size:12px">'+(refCanc?'Cancelada':'Liquidada')+'</span>'}</div></td>
        </tr>`;
        const rowExp=open?`<tr class="abonos-row"><td colspan="8"><div class="abonos-inner">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-mut);font-weight:600;margin-bottom:6px">Historial de abonos</div>
          ${ct.abonos.length?ct.abonos.slice().sort((a,b)=>a.fecha<b.fecha?-1:1).map(ab=>`<div class="abono-line"><span>${fmtDate(ab.fecha)} · ${esc(ab.nota||'Abono')}</span><span style="font-weight:600;color:var(--text)">${fmt(ab.monto)}</span></div>`).join(''):'<div class="muted" style="font-size:12.5px;padding:4px 0">Sin abonos registrados</div>'}
        </div></td></tr>`:'';
        return rowMain+rowExp;
      }).join(''):`<tr><td colspan="8"><div class="empty"><i data-lucide="wallet"></i><p>Sin cuentas</p></div></td></tr>`}
      </tbody></table></div></div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ pagosTab=b.dataset.tab; expandedCuenta=null; renderPagos(c); icons(); });
  document.querySelectorAll('#pf button').forEach(b=>b.onclick=()=>{ pagosFilter=b.dataset.f; renderPagos(c); icons(); });
  icons();
}
function toggleExpand(id){ expandedCuenta=expandedCuenta===id?null:id; renderPagos(document.getElementById('content')); icons(); }
function openAbono(cuentaId){
  const ct=DB.cuentas.find(c=>c.id===cuentaId);
  const sal=cuentaSaldo(ct);
  openModal('Registrar abono',`
    <p style="font-size:13px;color:var(--text-soft);margin-bottom:14px">${ct.tipo==='cxc'?'Cliente':'Proveedor'}: <strong>${esc(entName(ct.entidadId))}</strong> · Saldo: <strong>${fmt(sal)}</strong></p>
    <div class="field"><label>Monto</label><input class="input" type="number" min="0" step="0.01" id="ab_monto" value="${sal.toFixed(2)}"></div>
    <div class="field"><label>Fecha</label><input class="input" type="date" id="ab_fecha" value="${todayISO()}"></div>
    <div class="field"><label>Nota (opcional)</label><input class="input" id="ab_nota" placeholder="Transferencia, efectivo…"></div>
  `,async()=>{
    const monto=parseFloat(document.getElementById('ab_monto').value)||0;
    const fecha=document.getElementById('ab_fecha').value||todayISO();
    const nota=document.getElementById('ab_nota').value.trim();
    if(monto<=0){ toast('Monto inválido','alert-circle'); return false; }
    if(monto>sal+0.001){ toast('El abono supera el saldo','alert-circle'); return false; }
    setSyncStatus('syncing');
    try{

let movTipo='todos', movDesde='', movHasta='';

  if(movHasta) movs=movs.filter(m=>m.fecha<=movHasta);
  const ent_=movs.filter(m=>m.signo>0).reduce((a,m)=>a+m.monto,0);

      <thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th class="num">Monto</th>${can('saldoAcum')?'<th class="num">Saldo acum.</th>':''}<th></th></tr></thead>

  document.getElementById('m_desde').onchange=e=>{ movDesde=e.target.value; renderMovimientos(c); icons(); };
  document.getElementById('m_hasta').onchange=e=>{ movHasta=e.target.value; renderMovimientos(c); icons(); };
  document.getElementById('m_clear').onclick=()=>{ movTipo='todos'; movDesde=''; movHasta=''; renderMovimientos(c); icons(); };

/* ---- Detalle de un movimiento (ojo en la bitacora) ---- */
function verMovimiento(key){
  const dash=key.indexOf('-');
  const t=key.slice(0,dash), id=key.slice(dash+1);
  if(t==='v') return verDetalle(id,'ventas');
  if(t==='c') return verDetalle(id,'compras');
  if(t==='ab'){
    let cuenta=null, abono=null;
    for(const ct of DB.cuentas){ const a=ct.abonos.find(x=>x.id===id); if(a){ cuenta=ct; abono=a; break; } }
    if(!abono){ toast('Movimiento no encontrado','alert-triangle'); return; }
    const esCobro = cuenta.tipo==='cxc';
    const ref = esCobro ? DB.ventas.find(v=>v.id===cuenta.refId) : DB.compras.find(c=>c.id===cuenta.refId);
    const refTotal = ref ? (esCobro ? ref.total : compraTotal(ref)) : cuenta.montoTotal;
    const pagadoTot = cuentaPagado(cuenta), saldo = cuentaSaldo(cuenta);
    const color = esCobro ? 'var(--green)' : 'var(--red)';
    const row=(l,r,extra='')=>`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="muted">${l}</span><span style="${extra}">${r}</span></div>`;
    openModal(`Detalle · ${esCobro?'Abono cobrado':'Abono pagado'}`,`
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-soft);margin-bottom:14px">
        <span><strong>${esc(entName(cuenta.entidadId))}</strong></span>
        <span>${fmtDate(abono.fecha)} · ${esCobro?'CxC':'CxP'}</span>
      </div>
      <div style="padding:12px 14px;background:${esCobro?'#f0fdf4':'#fff5f5'};border-radius:10px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600">${esCobro?'Monto cobrado':'Monto pagado'}</span>
        <span style="font-size:18px;font-weight:800;color:${color}">${esCobro?'+':'−'}${fmt(abono.monto)}</span>
      </div>
      ${abono.nota?`<div style="font-size:12.5px;color:var(--text-soft);margin-bottom:14px"><i data-lucide="sticky-note" style="width:13px;height:13px;vertical-align:-2px"></i> ${esc(abono.nota)}</div>`:''}
      <div style="padding-top:12px;border-top:1px solid var(--border);font-size:13px">
        <div style="font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text-soft);margin-bottom:8px">CUENTA ORIGEN · ${esc(ref?(esCobro?'VENTA':'COMPRA'):'—')} ${ref?fmtDate(ref.fecha):''}</div>
        ${row('Monto total de la cuenta', fmt(refTotal))}
        ${row('Pagado acumulado', fmt(pagadoTot))}
        ${row('Saldo restante', fmt(saldo), 'font-weight:700;color:'+(saldo>0.001?'var(--amber)':'var(--green)'))}
      </div>
      ${ref&&!ref.cancelado?`<button class="btn btn-ghost" id="verOp" style="width:100%;margin-top:14px;justify-content:center"><i data-lucide="external-link"></i>Ver ${esCobro?'venta':'compra'} completa</button>`:''}
    `,null,null);
    setTimeout(()=>{
      const f=document.querySelector('.modal-foot'); if(f) f.style.display='none';
      const vo=document.getElementById('verOp'); if(vo) vo.onclick=()=>verDetalle(ref.id, esCobro?'ventas':'compras');
      icons();
    },10);
  }
}

/* =========================================================
   CARDS / PERFILES  (Cliente · Proveedor · Producto)
   Todo derivado de DB — sin tablas nuevas
   ========================================================= */
let perfilEntId=null, perfilProdId=null, perfilPeriodo='todo';
const MESES_ES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function matchPerfilPeriodo(iso,p){
  if(!p||p==='todo') return true;
  if(p==='mes-actual'){ const n=new Date(); const [y,m]=iso.slice(0,7).split('-'); return +y===n.getFullYear() && (+m-1)===n.getMonth(); }
  return iso.slice(0,7)===p; // formato YYYY-MM
}
function mesesDeEntidad(id){
  const set=new Set();
  ventasActivas().filter(v=>v.entidadId===id).forEach(v=>set.add(v.fecha.slice(0,7)));
  comprasActivas().filter(c=>c.entidadId===id).forEach(c=>set.add(c.fecha.slice(0,7)));
  return [...set].sort().reverse();
}
function labelMes(ym){ const [y,m]=ym.split('-'); return `${MESES_ES[+m-1]} ${y}`; }
let perfilProdPeriod=6;   // meses del gráfico de tendencia
let prodChart=null;

/* ---- helpers ---- */
function ventasDeEntidad(id){ return ventasActivas().filter(v=>v.entidadId===id).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)); }
function comprasDeEntidad(id){ return comprasActivas().filter(c=>c.entidadId===id).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)); }
function cuentasVivas(id,tipo){
  return DB.cuentas.filter(ct=>ct.tipo===tipo && ct.entidadId===id && !cuentaCancelada(ct));
}
function lineasResumen(r){
  const pz=r.lineas.reduce((a,l)=>a+(l.cantidad||0),0);
  const nombres=r.lineas.map(l=>prodName(l.productoId)).filter(Boolean);
  const primero=nombres[0]||'—';
  const extra=nombres.length>1?` +${nombres.length-1}`:'';
  return `<span title="${esc(nombres.join(', '))}">${esc(primero)}${extra} · ${fmtInt(pz)} pz</span>`;
}
function kpiBlock(items){
  return `<div class="kpi-grid">${items.map(k=>`
    <div class="kpi"><div class="lbl">${k.icon?`<i data-lucide="${k.icon}"></i>`:''}${k.lbl}</div>
    <div class="val ${k.color||''}">${k.val}</div>${k.sub?`<div class="sub">${k.sub}</div>`:''}</div>`).join('')}</div>`;
}
function estadoCuentaHTML(cuentas,titulo,badgeCls){
  if(!cuentas.length) return '';
  const saldoTot=cuentas.reduce((a,ct)=>a+cuentaSaldo(ct),0);
  return `<div class="card" style="margin-bottom:18px">
    <div class="card-head"><h3>${titulo}</h3><span class="badge ${saldoTot>0.001?badgeCls:'green'}">Saldo ${fmt(saldoTot)}</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Fecha</th><th class="num">Monto</th><th class="num">Pagado</th><th class="num">Saldo</th><th>Estado</th></tr></thead>
      <tbody>${cuentas.map(ct=>{
        const est=cuentaEstado(ct), b=est==='pagado'?'green':est==='parcial'?'amber':'red';
        return `<tr><td>${fmtDate(ct.fechaOrigen)}</td><td class="num">${fmt(ct.montoTotal)}</td><td class="num">${fmt(cuentaPagado(ct))}</td><td class="num" style="font-weight:600">${fmt(cuentaSaldo(ct))}</td><td><span class="badge ${b}">${est}</span></td></tr>`;
      }).join('')}</tbody>
    </table></div></div>`;
}
function historialTransHTML(regs,tipo){
  const isV=tipo==='ventas';
  if(!regs.length) return `<div class="card" style="margin-bottom:18px"><div class="card-head"><h3>Historial de ${isV?'ventas':'compras'}</h3></div><div class="empty" style="padding:28px"><i data-lucide="${isV?'shopping-cart':'truck'}"></i><p>Sin ${isV?'ventas':'compras'} registradas</p></div></div>`;
  return `<div class="card" style="margin-bottom:18px">
    <div class="card-head"><h3>Historial de ${isV?'ventas':'compras'}</h3><span class="badge gray">${regs.length} ${isV?'venta(s)':'compra(s)'}</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Fecha</th><th>Productos</th><th>Condición</th><th class="num">${isV?'Total':'Total (c/flete)'}</th></tr></thead>
      <tbody>${regs.map(r=>{
        const total=isV?r.total:compraTotal(r);
        return `<tr style="cursor:pointer" onclick="verDetalle('${r.id}','${tipo}')"><td>${fmtDate(r.fecha)}</td><td>${lineasResumen(r)}</td><td><span class="badge ${r.condicion==='contado'?'green':'amber'}">${r.condicion}</span></td><td class="num" style="font-weight:600">${fmt(total)}</td></tr>`;
      }).join('')}</tbody>
    </table></div></div>`;
}

/* ---- CLIENTE / PROVEEDOR ---- */
function entidadCardHTML(id,modal,periodo){
  const e=ent(id); if(!e) return '<div class="empty"><p>Contacto no encontrado</p></div>';
  const p = periodo || perfilPeriodo || 'todo';
  const ventas=ventasDeEntidad(id).filter(v=>matchPerfilPeriodo(v.fecha,p));
  const compras=comprasDeEntidad(id).filter(c=>matchPerfilPeriodo(c.fecha,p));
  // El estado de cuenta (saldos abiertos) se filtra por fecha de origen de la cuenta
  const cxc=cuentasVivas(id,'cxc').filter(ct=>matchPerfilPeriodo(ct.fechaOrigen,p));
  const cxp=cuentasVivas(id,'cxp').filter(ct=>matchPerfilPeriodo(ct.fechaOrigen,p));
  const esCliente   = e.tipo==='cliente'   || e.tipo==='ambos' || ventasDeEntidad(id).length>0;
  const esProveedor = e.tipo==='proveedor' || e.tipo==='ambos' || comprasDeEntidad(id).length>0;

  const totVend=ventas.reduce((a,v)=>a+v.total,0);
  const totComp=compras.reduce((a,c)=>a+compraTotal(c),0);
  const saldoCxC=cxc.reduce((a,ct)=>a+cuentaSaldo(ct),0);
  const saldoCxP=cxp.reduce((a,ct)=>a+cuentaSaldo(ct),0);

  const meses=mesesDeEntidad(id);
  const selectorPeriodo=`<select class="input" id="perfilPerSel" style="width:auto;min-width:150px">
      <option value="todo" ${p==='todo'?'selected':''}>Todo el histórico</option>
      <option value="mes-actual" ${p==='mes-actual'?'selected':''}>Mes actual</option>
      ${meses.length?'<option disabled>──────────</option>':''}
      ${meses.map(ym=>`<option value="${ym}" ${p===ym?'selected':''}>${labelMes(ym)}</option>`).join('')}
    </select>`;

  let head=`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <div style="font-size:12.5px;color:var(--text-soft)">
      ${e.tipo==='cliente'?'<span class="badge indigo">Cliente</span>':e.tipo==='proveedor'?'<span class="badge amber">Proveedor</span>':'<span class="badge gray">Cliente y Proveedor</span>'}
      ${e.telefono?`&nbsp;·&nbsp;<i data-lucide="phone" style="width:12px;height:12px;vertical-align:-1px"></i> ${esc(e.telefono)}`:''}
      ${e.notas?`<div class="muted" style="margin-top:6px">${esc(e.notas)}</div>`:''}
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      ${selectorPeriodo}
      ${modal?`<button class="btn btn-ghost btn-sm" id="verPerfilEnt"><i data-lucide="expand"></i>Ver perfil completo</button>`:''}
    </div>
  </div>`;

  let ventaBlock='';
  if(esCliente){
    ventaBlock=kpiBlock([
      {lbl:'Total vendido',icon:'trending-up',val:fmt(totVend),sub:`${ventas.length} venta(s)`},
      {lbl:'Ticket promedio',icon:'receipt',val:fmt(ventas.length?totVend/ventas.length:0)},
      {lbl:'Saldo por cobrar',icon:'wallet',val:fmt(saldoCxC),color:saldoCxC>0.001?'amber':'green'},
      {lbl:'Última venta',icon:'calendar',val:ventas[0]?fmtDate(ventas[0].fecha):'—',sub:'&nbsp;'},
    ])+estadoCuentaHTML(cxc,'Estado de cuenta · Por cobrar (CxC)','amber')+historialTransHTML(ventas,'ventas');
  }
  let compraBlock='';
  if(esProveedor){
    compraBlock=kpiBlock([
      {lbl:'Total comprado',icon:'trending-down',val:fmt(totComp),sub:`${compras.length} compra(s)`},
      {lbl:'Ticket promedio',icon:'receipt',val:fmt(compras.length?totComp/compras.length:0)},
      {lbl:'Saldo por pagar',icon:'wallet',val:fmt(saldoCxP),color:saldoCxP>0.001?'red':'green'},
      {lbl:'Última compra',icon:'calendar',val:compras[0]?fmtDate(compras[0].fecha):'—',sub:'&nbsp;'},
    ])+estadoCuentaHTML(cxp,'Estado de cuenta · Por pagar (CxP)','red')+historialTransHTML(compras,'compras');
  }
  const sep=(esCliente&&esProveedor)?'<div style="height:2px;background:var(--border);margin:22px 0"></div>':'';
  return head+ventaBlock+sep+compraBlock;
}

/* ---- PRODUCTO ---- */
function topCompradoresHTML(id){
  const map={};
  ventasActivas().forEach(v=>v.lineas.filter(l=>l.productoId===id).forEach(l=>{
    if(!map[v.entidadId]) map[v.entidadId]={u:0,ing:0};
    map[v.entidadId].u+=l.cantidad; map[v.entidadId].ing+=l.subtotal;
  }));
  const arr=Object.entries(map).map(([eid,d])=>({eid,...d})).sort((a,b)=>b.ing-a.ing);
  if(!arr.length) return '<div class="empty" style="padding:24px 20px"><p>Aún no se ha vendido</p></div>';
  const max=arr[0].ing||1;
  return arr.slice(0,8).map((it,i)=>`<div class="rank-item">
    <div class="rank-header"><span class="name">${i+1}. ${esc(entName(it.eid))}</span><span class="val">${fmtInt(it.u)} pz · <strong>${fmt(it.ing)}</strong></span></div>
    <div class="rank-bar-track"><div class="rank-bar-fill indigo" style="width:${it.ing/max*100}%"></div></div>
  </div>`).join('');
}
function drawProductoChart(id){
  if(prodChart){ prodChart.destroy(); prodChart=null; }
  const cv=document.getElementById('prodChartCanvas'); if(!cv) return;
  if(window.__chartFailed||!window.Chart){ cv.parentElement.innerHTML='<div class="empty"><p>Gráfica no disponible</p></div>'; return; }
  const N=perfilProdPeriod, now=new Date(), meses=[];
  for(let i=N-1;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); meses.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }
  const bk={}; meses.forEach(m=>bk[m]={u:0,ing:0});
  ventasActivas().forEach(v=>{ const m=v.fecha.slice(0,7); if(!(m in bk)) return; v.lineas.filter(l=>l.productoId===id).forEach(l=>{ bk[m].u+=l.cantidad; bk[m].ing+=l.subtotal; }); });
  const labels=meses.map(m=>{ const [y,mo]=m.split('-'); return mo+'/'+y.slice(2); });
  prodChart=new Chart(cv,{
    data:{ labels, datasets:[
      {type:'bar',label:'Unidades',data:meses.map(m=>bk[m].u),backgroundColor:'#6366f1',borderRadius:5,maxBarThickness:34,yAxisID:'y',order:2},
      {type:'line',label:'Ingreso',data:meses.map(m=>bk[m].ing),borderColor:'#16a34a',backgroundColor:'#16a34a22',borderWidth:2.5,pointRadius:3,pointBackgroundColor:'#16a34a',tension:.3,yAxisID:'y1',order:1},
    ]},
    options:{ responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:8,font:{family:'Inter',size:12}}},
        tooltip:{callbacks:{label:c=>c.dataset.label==='Ingreso'?'Ingreso: '+fmt(c.raw):'Unidades: '+fmtInt(c.raw)}}},
      scales:{ x:{grid:{display:false},ticks:{font:{family:'Inter',size:11}}},
        y:{beginAtZero:true,position:'left',ticks:{font:{size:11},precision:0},grid:{color:'#f0f0f0'}},
        y1:{beginAtZero:true,position:'right',ticks:{font:{size:11},callback:v=>v>=1000?'$'+(v/1000).toFixed(0)+'k':'$'+v},grid:{display:false}} }
    }
  });
}
function productoCardHTML(id,modal){

  const costoR=costoUnitReal(id);

    {lbl:'Stock actual',icon:'package',val:`${fmtInt(stock)} pz`,color:stock<=0?'red':'',sub:`Valor inv. ${fmt(valorInv)}`},

  const seg=`<div class="seg" id="prodPeriodSeg">${[[3,'3 meses'],[6,'6 meses'],[12,'12 meses']].map(o=>`<button data-pp="${o[0]}" class="${perfilProdPeriod===o[0]?'active':''}">${o[1]}</button>`).join('')}</div>`;
  const chartCard=`<div class="card" style="margin-bottom:18px">

    <div class="card-pad"><div style="height:240px"><canvas id="prodChartCanvas"></canvas></div></div></div>`;

  const rankCard=`<div class="card" style="margin-bottom:18px">
    <div class="card-head"><h3>Top compradores</h3><span class="badge indigo">por ingreso</span></div>
    <div class="card-pad">${topCompradoresHTML(id)}</div></div>`;

  const detCard=`<div class="card" style="margin-bottom:18px">

    <div class="tbl-wrap"><table>

      <tbody>${detalle.length?detalle.map(l=>`<tr style="cursor:pointer" onclick="verDetalle('${l.ventaId}','ventas')"><td>${fmtDate(l.fecha)}</td><td>${esc(entName(l.entidadId))}</td><td class="num">${fmtInt(l.cantidad)}</td><td class="num">${fmt(l.precioUnit)}</td><td class="num" style="font-weight:600">${fmt(l.subtotal)}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty" style="padding:24px"><p>Sin ventas registradas</p></div></td></tr>`}</tbody>
    </table></div></div>`;

  return head+kpis+chartCard+rankCard+detCard;

/* =========================================================
   MODAL & TOAST
   ========================================================= */
let modalConfirm=null;
function openModal(title,bodyHTML,onConfirm,confirmLabel,opts){
  modalConfirm=onConfirm;
  const _modalEl=document.getElementById('modal');
  _modalEl.style.maxWidth=(opts&&opts.wide)?'880px':'';
  _modalEl.innerHTML=`
    <div class="modal-head"><h3>${title}</h3><button class="btn-icon" id="mClose"><i data-lucide="x"></i></button></div>
    <div class="modal-body">${bodyHTML}</div>
    ${onConfirm!==null?`<div class="modal-foot"><button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mOk"><i data-lucide="check"></i>${confirmLabel||'Guardar'}</button></div>`:''}`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('mClose').onclick=closeModal;
  const mc=document.getElementById('mCancel'); if(mc) mc.onclick=closeModal;
  const mo=document.getElementById('mOk'); if(mo) mo.onclick=()=>{ if(modalConfirm) modalConfirm(); };
  icons();
  setTimeout(()=>{ const f=document.querySelector('.modal-body input,.modal-body select,.modal-body textarea'); if(f) f.focus(); },50);
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); modalConfirm=null; formAfterEntity=null; }
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
let toastT=null;
function toast(msg,icon){
  const t=document.getElementById('toast');
  t.innerHTML=`<i data-lucide="${icon||'info'}"></i>${esc(msg)}`;
  t.classList.add('show'); icons(); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

      </div>

  openModal(`${isEdit?'Editar':'Registrar'} Gasto`, `

      <input type="date" id="gFecha" class="input" value="${g?g.fecha:todayISO()}"></div>

    <div class="form-group"><label>Monto</label>
