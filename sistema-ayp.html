/* =========================================================
   MÓDULO ESTADOS FINANCIEROS — render
   ========================================================= */
let finPeriodo = 'mes';
function renderFinanzas(c){
  setTop('Estados Financieros','P&L · Flujo de efectivo');

  const p = finPeriodo;
  const ventas = ventasActivas().filter(v=>inPeriod(v.fecha,p));
  const compras = comprasActivas().filter(x=>inPeriod(x.fecha,p));
  const gastos  = gastosEnPeriodo(p);

  // ── Ingresos ──
  const ingresos = ventas.reduce((a,v)=>a+v.total, 0);

  // ── COGS: landed cost real de las ventas del período ──
  const cogs = ventas.reduce((a,v)=>a+costoVentaReal(v), 0);

  // ── Utilidad Bruta ──
  const utilBruta = ingresos - cogs;
  const margenBruto = ingresos>0?(utilBruta/ingresos*100):0;

  // ── Gastos Operativos por categoría ──
  const opexPorCat = CATEGORIAS_GASTO.map(cat=>({
    ...cat,
    total: gastos.filter(g=>g.categoria===cat.id).reduce((a,g)=>a+g.monto,0)
  })).filter(c=>c.total>0);
  const totalOpex = opexPorCat.reduce((a,c)=>a+c.total, 0);

  // ── Utilidad Neta ──
  const utilNeta = utilBruta - totalOpex;
  const margenNeto = ingresos>0?(utilNeta/ingresos*100):0;

  // ── Flujo de Efectivo ──
  // Entradas reales de caja en el período
  let cobrado = 0;
  ventas.filter(v=>v.condicion==='contado').forEach(v=>cobrado+=v.total);
  DB.cuentas.forEach(ct=>{
    if(ct.tipo!=='cxc') return;
    const venta = DB.ventas.find(v=>v.id===ct.refId);
    if(!venta||venta.cancelado) return;
    ct.abonos.filter(a=>inPeriod(a.fecha,p)).forEach(a=>cobrado+=a.monto);
  });
  // Salidas reales de caja en el período (compras pagadas + gastos)
  let pagadoCompras = 0;
  compras.filter(x=>x.condicion==='contado').forEach(x=>pagadoCompras+=compraTotal(x));
  DB.cuentas.forEach(ct=>{
    if(ct.tipo!=='cxp') return;
    const comp = DB.compras.find(x=>x.id===ct.refId);
    if(!comp||comp.cancelado) return;
    ct.abonos.filter(a=>inPeriod(a.fecha,p)).forEach(a=>pagadoCompras+=a.monto);
  });
  const pagadoGastos = gastos.reduce((a,g)=>a+g.monto,0);
  const totalSalidas = pagadoCompras + pagadoGastos;
  const flujoNeto = cobrado - totalSalidas;

  // ── Reparto de utilidades (histórico acumulado, independiente del período) ──
  const ingresosHist = ventasActivas().reduce((a,v)=>a+v.total,0);
  const cogsHist     = ventasActivas().reduce((a,v)=>a+costoVentaReal(v),0);
  const opexHist     = DB.gastos.reduce((a,g)=>a+g.monto,0);
  const utilNetaHist = ingresosHist - cogsHist - opexHist;
  const totalRetirado= (DB.retiros||[]).reduce((a,r)=>a+r.monto,0);
  const dispRepartir = utilNetaHist - totalRetirado;

  // ── HTML ──
  const periodos = [{k:'hoy',l:'Hoy'},{k:'semana',l:'Semana'},{k:'mes',l:'Mes'},{k:'todo',l:'Todo'}];
  const fmtPct = n=>`<span style="font-weight:700;color:${n>=0?'var(--green)':'var(--red)'}">${n.toFixed(1)}%</span>`;
  const fmtVal = (n,bold=false)=>`<span style="font-weight:${bold?700:500};color:${n>=0?'var(--green)':'var(--red)'}">${fmt(n)}</span>`;

  c.innerHTML = `
    <div class="seg-ctrl" id="finSeg" style="margin-bottom:20px">
      ${periodos.map(x=>`<button data-fp="${x.k}" class="${finPeriodo===x.k?'active':''}">${x.l}</button>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px" id="finCols">

      <!-- Columna izquierda: Estado de Resultados + Reparto -->
      <div style="display:flex;flex-direction:column;gap:18px">
      <div class="card">
        <div class="card-head"><h3>Estado de Resultados</h3><span class="badge gray">${finPeriodo}</span></div>
        <div style="padding:0 20px 20px">

          <div style="border-left:3px solid var(--green);padding:10px 14px;margin-bottom:4px;background:#f0fdf422;border-radius:0 6px 6px 0">
            <div style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--green);margin-bottom:8px">INGRESOS</div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="color:var(--text-soft)">Ventas del período</span>
              <span style="font-weight:600">${fmt(ingresos)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-weight:700;margin-top:8px;padding-top:8px;border-top:1px solid #e2e8f0">
              <span>Total Ingresos</span><span style="color:var(--green)">${fmt(ingresos)}</span>
            </div>
          </div>

          <div style="border-left:3px solid #8b5cf6;padding:10px 14px;margin:4px 0;background:#8b5cf608;border-radius:0 6px 6px 0">
            <div style="font-size:10px;font-weight:700;letter-spacing:.08em;color:#8b5cf6;margin-bottom:8px">COSTO DE VENTAS (COGS)</div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="color:var(--text-soft)">Costo real de mercancía vendida</span>
              <span style="font-weight:600;color:var(--red)">${fmt(-cogs)}</span>
            </div>
          </div>

          <div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;padding:12px 14px;background:#f8fafc;border-radius:8px;margin:8px 0">
            <span>Utilidad Bruta</span><span style="color:${utilBruta>=0?'var(--green)':'var(--red)'}">${fmt(utilBruta)}</span>
          </div>
          <div style="text-align:right;font-size:12px;color:var(--text-soft);margin-bottom:12px">Margen Bruto: ${fmtPct(margenBruto)}</div>

          <div style="border-left:3px solid #f59e0b;padding:10px 14px;margin:4px 0;background:#f59e0b08;border-radius:0 6px 6px 0">
            <div style="font-size:10px;font-weight:700;letter-spacing:.08em;color:#f59e0b;margin-bottom:8px">GASTOS OPERATIVOS</div>
            ${opexPorCat.length ? opexPorCat.map(cat=>`
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <span style="color:var(--text-soft);display:flex;align-items:center;gap:6px">
                  <span style="width:7px;height:7px;border-radius:50%;background:${cat.color};display:inline-block"></span>${cat.label}
                </span>
                <span style="font-weight:600;color:var(--red)">${fmt(-cat.total)}</span>
              </div>`).join('')
            : `<div style="color:var(--text-soft);font-size:13px">Sin gastos en el período</div>`}
            <div style="display:flex;justify-content:space-between;font-weight:700;margin-top:8px;padding-top:8px;border-top:1px solid #e2e8f0">
              <span>Total Gastos Op.</span><span style="color:var(--red)">${fmt(-totalOpex)}</span>
            </div>
          </div>

          <div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;padding:14px 14px;background:${utilNeta>=0?'#f0fdf4':'#fff5f5'};border-radius:8px;margin-top:10px;border:2px solid ${utilNeta>=0?'#16a34a33':'#dc262633'}">
            <span>Utilidad Neta</span><span style="color:${utilNeta>=0?'var(--green)':'var(--red)'}">${fmt(utilNeta)}</span>
          </div>
          <div style="text-align:right;font-size:12px;color:var(--text-soft);margin-top:6px">Margen Neto: ${fmtPct(margenNeto)}</div>
        </div>
      </div>
      ${can('repartoUtil')?repartoCardHTML(utilNetaHist,totalRetirado,dispRepartir,utilNeta,finPeriodo):''}
      </div>

      <!-- Columna derecha: KPIs + Flujo -->
      <div style="display:flex;flex-direction:column;gap:18px">
        <!-- KPIs -->
        <div class="card">
          <div class="card-head"><h3>Indicadores clave</h3></div>
          <div style="padding:0 20px 16px">
            ${[
              {l:'Margen Bruto',s:'Ingresos − COGS',v:margenBruto,pct:true},
              {l:'Margen Neto',s:'Después de gastos operativos',v:margenNeto,pct:true},
              {l:'Total Gastos Op.',s:'Suma del período',v:-totalOpex,pct:false},
              {l:'Ratio Gastos/Ingreso',s:'Menor = más eficiente',v:ingresos>0?-(totalOpex/ingresos*100):null,pct:true},
            ].map(k=>`
              <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid #f0f4f8">
                <div><div style="font-weight:600;font-size:13px">${k.l}</div><div style="font-size:11px;color:var(--text-soft)">${k.s}</div></div>
                <div style="font-weight:700;font-size:14px;color:${k.v===null?'var(--red)':k.v>=0?'var(--green)':'var(--red)'}">
                  ${k.v===null?'—':k.pct?Math.abs(k.v).toFixed(1)+'%':fmt(Math.abs(k.v))}
                </div>
              </div>`).join('')}
          </div>
        </div>

        <!-- Flujo de Efectivo -->
        <div class="card">
          <div class="card-head"><h3>Flujo de Efectivo</h3></div>
          <div style="padding:0 20px 16px">
            <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f4f8">
              <span style="color:var(--text-soft)">(+) Cobrado a clientes</span>
              <span style="color:var(--green);font-weight:600">+${fmt(cobrado)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f4f8">
              <span style="color:var(--text-soft)">(−) Pagado a proveedores</span>
              <span style="color:var(--red);font-weight:600">−${fmt(pagadoCompras)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f4f8">
              <span style="color:var(--text-soft)">(−) Gastos operativos</span>
              <span style="color:var(--red);font-weight:600">−${fmt(pagadoGastos)}</span>
            </div>
            ${can('flujoNeto')?`<div style="display:flex;justify-content:space-between;padding:14px 0 4px;font-weight:700;font-size:1.05rem">
              <span>Flujo neto del período</span>
              <span style="color:${flujoNeto>=0?'var(--green)':'var(--red)'}">${flujoNeto>=0?'+':''}${fmt(flujoNeto)}</span>
            </div>`:''}
          </div>
        </div>

        <!-- Desglose gastos por categoría -->
        ${opexPorCat.length?`
        <div class="card">
          <div class="card-head"><h3>Desglose gastos</h3></div>
          <div style="padding:0 20px 16px">
            ${opexPorCat.map(cat=>{
              const pct=totalOpex>0?(cat.total/totalOpex*100).toFixed(0):0;
              return `<div style="margin-bottom:12px">
                <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                  <span style="font-size:12px;font-weight:600;color:${cat.color}">${cat.label}</span>
                  <span style="font-size:12px;font-weight:700">${fmt(cat.total)}</span>
                </div>
                <div style="height:5px;background:#f0f4f8;border-radius:99px">
                  <div style="height:5px;background:${cat.color};border-radius:99px;width:${pct}%"></div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`:''}
      </div>
    </div>`;

  document.querySelectorAll('#finSeg button').forEach(b=>b.onclick=()=>{ finPeriodo=b.dataset.fp; renderFinanzas(c); icons(); });
  const br=document.getElementById('btnRetiro'); if(br) br.onclick=openRetiroModal;
  if(window.innerWidth<900) document.getElementById('finCols').style.gridTemplateColumns='1fr';
  icons();
}

/* ---- Reparto de utilidades: tarjeta + retiros ---- */
function repartoCardHTML(utilHist, retirado, disp, utilPeriodo, p){
  const retiros=(DB.retiros||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const falta=window.__retirosTablaFalta;
  return `<div class="card">
    <div class="card-head"><h3>Reparto de Utilidades</h3><span class="badge indigo">solo dueño</span></div>
    <div style="padding:0 20px 20px">
      ${falta?`<div class="reparto-warn"><i data-lucide="alert-triangle"></i><span>Para guardar retiros falta crear la tabla <strong>ayp_retiros</strong> en Supabase. Puedes ver el cálculo, pero el registro está deshabilitado hasta correr el SQL.</span></div>`:''}
      <div class="reparto-stats">
        <div class="reparto-stat"><div class="rs-lbl">Utilidad neta acum.</div><div class="rs-val" style="color:${utilHist>=0?'var(--green)':'var(--red)'}">${fmt(utilHist)}</div></div>
        <div class="reparto-stat"><div class="rs-lbl">Total retirado</div><div class="rs-val">${fmt(retirado)}</div></div>
        <div class="reparto-stat"><div class="rs-lbl">Disponible</div><div class="rs-val" style="color:${disp>=0?'var(--green)':'var(--red)'}">${fmt(disp)}</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--text-soft);margin-bottom:14px;flex-wrap:wrap">
        <span>Utilidad neta del período (${p}): <strong style="color:${utilPeriodo>=0?'var(--green)':'var(--red)'}">${fmt(utilPeriodo)}</strong></span>
        <button class="btn btn-primary btn-sm" id="btnRetiro" ${falta?'disabled style="opacity:.5;cursor:not-allowed"':''}><i data-lucide="plus"></i>Registrar retiro</button>
      </div>
      ${retiros.length?`<div class="tbl-wrap"><table>
        <thead><tr><th>Fecha</th><th>Nota</th><th class="num">Monto</th><th></th></tr></thead>
        <tbody>${retiros.map(r=>`<tr>
          <td class="muted">${fmtDate(r.fecha)}</td>
          <td>${esc(r.nota||'Retiro de utilidades')}</td>
          <td class="num" style="font-weight:700;color:var(--red)">−${fmt(r.monto)}</td>
          <td><button class="btn-icon" onclick="deleteRetiro('${r.id}')" style="color:var(--red)" title="Eliminar retiro"><i data-lucide="trash-2"></i></button></td>
        </tr>`).join('')}</tbody>
      </table></div>`:`<div class="empty" style="padding:22px 20px"><i data-lucide="hand-coins"></i><p>Sin retiros registrados</p></div>`}
    </div>
  </div>`;
}
function openRetiroModal(){
  if(window.__retirosTablaFalta){ toast('Primero crea la tabla ayp_retiros','alert-triangle'); return; }
  openModal('Registrar retiro de utilidades',`
    <div class="form-group"><label>Fecha</label>
      <input type="date" id="rFecha" class="input" value="${todayISO()}"></div>
    <div class="form-group"><label>Monto</label>
      <input type="number" id="rMonto" class="input" min="0" step="0.01" placeholder="0.00"></div>
    <div class="form-group"><label>Nota <span style="color:var(--text-soft);font-weight:400">(opcional)</span></label>
      <input type="text" id="rNota" class="input" placeholder="Ej: retiro mensual, reinversión…"></div>
  `, async ()=>{
    const fecha=document.getElementById('rFecha').value||todayISO();
    const monto=parseFloat(document.getElementById('rMonto').value)||0;
    const nota=document.getElementById('rNota').value.trim();
    if(monto<=0){ alert('Ingresa un monto válido'); return; }
    const id=uid();
    try{
      await sbInsert('ayp_retiros',[{id,fecha,monto,nota,socio:SESION?SESION.nombre:'Pablo'}]);
      DB.retiros.unshift({id,fecha,monto,nota,socio:SESION?SESION.nombre:'Pablo'});
      closeModal(); toast('Retiro registrado','check-circle');
      render();
    }catch(e){ alert('Error al guardar: '+e.message); }
  }, 'Registrar retiro');
}
async function deleteRetiro(id){
  if(!confirm('¿Eliminar este retiro?')) return;
  try{ await sbDelete('ayp_retiros',id); }catch(e){ alert('Error: '+e.message); return; }
  DB.retiros=(DB.retiros||[]).filter(r=>r.id!==id);
  toast('Retiro eliminado','trash-2');
  render();
}
/* =========================================================
   USUARIOS Y ACCESOS  (solo dueño)
   ========================================================= */
function renderUsuarios(c){
  if(!esDueno()){ c.innerHTML='<div class="empty"><i data-lucide="lock"></i><p>Sin acceso</p></div>'; icons(); return; }
  setTop('Usuarios y Accesos','Controla quién entra y con qué permisos',`<button class="btn btn-primary" onclick="openUsuarioModal()"><i data-lucide="user-plus"></i>Nuevo usuario</button>`);
  const us=DB.usuarios.slice().sort((a,b)=>(a.nombre||a.email).localeCompare(b.nombre||b.email));
  c.innerHTML=`<div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Acceso a dinero</th><th>Estado</th><th></th></tr></thead>
    <tbody>${us.length?us.map(u=>`<tr style="${u.activo?'':'opacity:.5'}">
      <td style="font-weight:600">${esc(u.nombre||'—')}</td>
      <td class="muted">${esc(u.email)}</td>
      <td>${u.rol==='dueno'?'<span class="badge indigo">Dueño</span>':'<span class="badge gray">Operación</span>'}</td>
      <td class="muted" style="font-size:12px">${u.rol==='dueno'?'Total (reparto, flujo, saldos)':'Limitado (sin reparto ni flujo neto)'}</td>
      <td>${u.activo?'<span class="badge green"><span class="dot"></span>Activo</span>':'<span class="badge gray">Inactivo</span>'}</td>
      <td><div class="row-actions">
        <button class="btn-icon" onclick="openUsuarioModal('${u.id}')" title="Editar"><i data-lucide="pencil"></i></button>
        <button class="btn-icon" onclick="toggleUsuario('${u.id}')" title="${u.activo?'Desactivar':'Activar'}"><i data-lucide="${u.activo?'user-x':'user-check'}"></i></button>
        ${u.id===SESION.id?'':`<button class="btn-icon" onclick="deleteUsuario('${u.id}')" style="color:var(--red)" title="Eliminar"><i data-lucide="trash-2"></i></button>`}
      </div></td>
    </tr>`).join(''):`<tr><td colspan="6"><div class="empty"><i data-lucide="users"></i><p>Sin usuarios</p></div></td></tr>`}
  </tbody></table></div></div>
  <p class="hint" style="margin-top:12px"><strong>Dueño</strong>: ve todo, incluido Reparto de Utilidades, flujo neto y saldos. &nbsp;<strong>Operación</strong>: registra y opera el negocio, pero no ve tus utilidades ni el dinero disponible.</p>`;
  icons();
}
function openUsuarioModal(id){
  const u=id?DB.usuarios.find(x=>x.id===id):null;
  openModal(u?'Editar usuario':'Nuevo usuario',`
    <div class="field"><label>Nombre</label><input class="input" id="u_nombre" value="${u?esc(u.nombre||''):''}" placeholder="Nombre de la persona"></div>
    <div class="field"><label>Correo</label><input class="input" id="u_email" type="email" value="${u?esc(u.email):''}" placeholder="correo@ayp.mx"></div>
    <div class="field"><label>Rol / Permisos</label><select class="input" id="u_rol">
      <option value="empleado" ${u&&u.rol==='empleado'?'selected':''}>Operación (limitado)</option>
      <option value="dueno" ${u&&u.rol==='dueno'?'selected':''}>Dueño (acceso total)</option>
    </select></div>
    <div class="field"><label>Contraseña ${u?'<span style="color:var(--text-soft);font-weight:400">(dejar vacío para no cambiarla)</span>':''}</label><input class="input" id="u_pass" type="text" placeholder="${u?'sin cambios':'Contraseña de acceso'}"></div>
  `, async ()=>{
    const nombre=document.getElementById('u_nombre').value.trim();
    const email=document.getElementById('u_email').value.trim().toLowerCase();
    const rol=document.getElementById('u_rol').value;
    const pass=document.getElementById('u_pass').value;
    if(!email){ alert('Escribe un correo'); return; }
    if(!u && !pass){ alert('Escribe una contraseña para el nuevo usuario'); return; }
    try{
      if(u){
        const body={nombre,email,rol};
        if(pass) body.pass_hash=await hashPass(pass);
        await sbUpdate('ayp_usuarios',u.id,body);
      } else {
        await sbInsert('ayp_usuarios',[{id:uid(),nombre,email,rol,pass_hash:await hashPass(pass),activo:true}]);
      }
      await loadUsuarios(); closeModal(); render(); toast('Usuario guardado','check-circle');
    }catch(e){ alert('Error: '+e.message+(String(e.message).toLowerCase().includes('duplicate')?' — ese correo ya está registrado.':'')); }
  }, u?'Guardar':'Crear usuario');
}
async function toggleUsuario(id){
  const u=DB.usuarios.find(x=>x.id===id); if(!u) return;
  if(u.id===SESION.id){ toast('No puedes desactivar tu propia cuenta','alert-triangle'); return; }
  try{ await sbUpdate('ayp_usuarios',id,{activo:!u.activo}); await loadUsuarios(); render(); }
  catch(e){ alert('Error: '+e.message); }
}
async function deleteUsuario(id){
  if(id===SESION.id){ toast('No puedes eliminar tu propia cuenta','alert-triangle'); return; }
  if(!confirm('¿Eliminar este usuario? Ya no podrá entrar.')) return;
  try{ await sbDelete('ayp_usuarios',id); await loadUsuarios(); render(); toast('Usuario eliminado','trash-2'); }
  catch(e){ alert('Error: '+e.message); }
}

/* =========================================================
   NAV — Event delegation (sobrevive re-renders de lucide)
   ========================================================= */
// El script es defer-equivalent (al final del body), sidebar ya existe
document.querySelector('.sidebar').addEventListener('click', e=>{

/* =========================================================
   INIT
   ========================================================= */
/* ---------- LOGIN: correo + contraseña ---------- */
function showLogin(){
  const ls=document.getElementById('loadingScreen'); ls.classList.add('hidden'); ls.style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  renderLoginForm();
}
function renderLoginForm(){
  const el=document.getElementById('loginBox');
  el.innerHTML=`
    <div class="login-head">
      <div class="login-logo"><i data-lucide="boxes"></i></div>
      <h1>Sistema AyP</h1>
      <p>Inicia sesión para continuar</p>
    </div>
    <div class="login-form">
      <div class="field"><label>Correo</label>
        <input class="input" type="email" id="lg_email" placeholder="tucorreo@ayp.mx" autocomplete="username"></div>
      <div class="field"><label>Contraseña</label>
        <input class="input" type="password" id="lg_pass" placeholder="••••••••" autocomplete="current-password"></div>
      <div class="pin-err" id="lg_err"></div>
      <button class="btn btn-primary" id="lg_btn" style="width:100%;justify-content:center"><i data-lucide="log-in"></i>Entrar</button>
    </div>`;
  icons();
  const btn=document.getElementById('lg_btn');
  btn.onclick=hacerLogin;
  document.getElementById('lg_pass').addEventListener('keydown',e=>{ if(e.key==='Enter') hacerLogin(); });
  document.getElementById('lg_email').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('lg_pass').focus(); });
  setTimeout(()=>{ const f=document.getElementById('lg_email'); if(f) f.focus(); },60);
}
async function hacerLogin(){
  const email=(document.getElementById('lg_email').value||'').trim().toLowerCase();
  const pass=document.getElementById('lg_pass').value||'';
  const err=document.getElementById('lg_err'); const btn=document.getElementById('lg_btn');
  if(err) err.textContent='';
  if(!email || !pass){ if(err) err.textContent='Escribe tu correo y contraseña'; return; }
  btn.disabled=true; btn.innerHTML='<i data-lucide="loader"></i>Verificando…'; icons();
  try{
    await loadUsuarios();
    const h=await hashPass(pass);
    const u=DB.usuarios.find(x=>x.email && x.email.toLowerCase()===email && x.activo);
    if(!u || u.passHash!==h){
      if(err) err.textContent='Correo o contraseña incorrectos';
      btn.disabled=false; btn.innerHTML='<i data-lucide="log-in"></i>Entrar'; icons(); return;
    }
    guardarSesion(u);
    document.getElementById('loginScreen').style.display='none';
    arrancarApp();
  }catch(e){
    if(err) err.textContent='No se pudo conectar con el servidor: '+e.message;
    btn.disabled=false; btn.innerHTML='<i data-lucide="log-in"></i>Entrar'; icons();
  }
}

/* ---------- Chip de usuario + logout ---------- */
function renderUserChip(){
  const el=document.getElementById('userChip'); if(!el||!SESION) return;
  el.innerHTML=`
    <div class="user-chip">
      <span class="uc-ic"><i data-lucide="user-round"></i></span>
      <div class="uc-info"><span class="uc-name">${esc(SESION.nombre||SESION.email)}</span></div>
      <button class="uc-out" id="ucOut" title="Cerrar sesión"><i data-lucide="log-out"></i></button>
    </div>`;
  icons();
  const out=document.getElementById('ucOut'); if(out) out.onclick=cerrarSesion;
}

/* ---------- Arranque de la app (tras validar sesion) ---------- */
async function arrancarApp(){
  const ls=document.getElementById('loadingScreen');
  ls.classList.remove('hidden'); ls.style.display='flex';
  document.getElementById('loginScreen').style.display='none';
  try{
    await loadAll();  // loadAll ya trae timeout por tabla y progreso
    await seedIfEmpty();
    try{ await loadUsuarios(); }catch(_){}
    ls.classList.add('hidden'); ls.style.display='none';   // forzar inline: la clase .hidden no vence al display:flex inline
    document.getElementById('appShell').style.display='flex';
    renderUserChip();
    renderNav(); render(); icons();
    initRealtime();
    initVisibilityReload();
    setSyncStatus('ok');
    // Retiros en segundo plano: NUNCA bloquea ni rompe el arranque de la app
    loadRetiros().then(()=>{ if(current==='finanzas') render(); }).catch(()=>{ window.__retirosTablaFalta=true; });
  }catch(err){
    document.getElementById('loadingMsg').textContent='Error al conectar con Supabase: '+err.message;
    const sp=document.querySelector('.loading-screen .spinner'); if(sp) sp.style.display='none';
    const btn=document.createElement('button'); btn.textContent='Reintentar'; btn.style.cssText='margin-top:14px;padding:9px 18px;border-radius:8px;border:1px solid #d4d4d8;background:#fff;font-weight:600;cursor:pointer';
    btn.onclick=()=>location.reload(); const ms=document.getElementById('loadingMsg'); if(ms&&ms.parentElement) ms.parentElement.appendChild(btn);
  }
}

/* ---------- Punto de entrada: sesion guardada o login ---------- */
function startup(){
  const s=sesionGuardada();
  if(s){ SESION=s; arrancarApp(); }
  else{ showLogin(); }
}

/* =========================================================
   RELOAD AL VOLVER A LA PESTAÑA
   ========================================================= */
function initVisibilityReload(){
  let lastHidden = null;

  // Se dispara cuando el usuario vuelve a esta pestaña
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState === 'visible'){
      // Solo recarga si estuvo oculta más de 3 segundos
      const away = lastHidden ? Date.now() - lastHidden : 0;
      if(away < 3000) return;
      setSyncStatus('syncing');
      try{
        await loadAll();
        render();
        setSyncStatus('ok');
      }catch(e){ setSyncStatus('error'); }
    } else {
      lastHidden = Date.now();
    }
  });

  // Fallback: también en focus de la ventana (Safari/Firefox)
  window.addEventListener('focus', async ()=>{
    if(document.visibilityState !== 'visible') return;
    const away = lastHidden ? Date.now() - lastHidden : 0;
    if(away < 3000) return;
    setSyncStatus('syncing');
    try{
      await loadAll();
      render();
      setSyncStatus('ok');
    }catch(e){ setSyncStatus('error'); }
  });
}

let tries=0;
(function boot(){
  const lReady=window.lucide||window.__lucideFailed;
  const cReady=window.Chart||window.__chartFailed;
  if((lReady&&cReady)||tries>25){ startup(); }
  else{ tries++; setTimeout(boot,80); }
})();
</script>
